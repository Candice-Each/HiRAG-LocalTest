<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HiRAG · 知識圖譜檢索終端</title>
  <script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-deep: #070b14;
      --surface: rgba(16, 24, 40, 0.78);
      --surface-solid: #101828;
      --card: rgba(255, 255, 255, 0.035);
      --card-hover: rgba(96, 165, 250, 0.10);
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.28);
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --highlight: #f59e0b;
      --highlight-soft: rgba(245, 158, 11, 0.14);
      --text: #e6edf7;
      --text-2: #9aa8bd;
      --text-3: #61718a;
      --radius: 12px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(820px 560px at 16% 10%, rgba(59, 130, 246, 0.16), transparent 62%),
        radial-gradient(760px 560px at 84% 92%, rgba(99, 102, 241, 0.13), transparent 62%),
        radial-gradient(600px 400px at 50% 50%, rgba(14, 165, 233, 0.05), transparent 70%),
        linear-gradient(180deg, #070b14 0%, #05080f 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 22%, transparent 76%);
      mask-image: radial-gradient(circle at 50% 46%, #000 22%, transparent 76%);
      opacity: 0.85;
    }

    #graph-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: default;
    }

    .command-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: min(680px, calc(100vw - 32px));
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 7px 7px 13px;
      background: linear-gradient(180deg, rgba(24, 34, 54, 0.92), rgba(14, 21, 36, 0.90));
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow:
        0 18px 46px -14px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease);
    }

    .command-bar:focus-within {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow:
        0 18px 46px -14px rgba(0, 0, 0, 0.85),
        0 0 0 3px rgba(59, 130, 246, 0.13);
    }

    #search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0.01em;
      padding: 4px 2px;
    }

    #search-input::placeholder {
      color: var(--text-3);
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }

    .icon-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }

    #search-btn {
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
      box-shadow: 0 5px 16px -5px rgba(59, 130, 246, 0.9);
      transition: filter 0.16s var(--ease), transform 0.12s var(--ease),
        box-shadow 0.16s var(--ease);
    }

    #search-btn:hover:not(:disabled) {
      filter: brightness(1.12);
      box-shadow: 0 7px 20px -5px rgba(59, 130, 246, 1);
    }

    #search-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    #search-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.35);
      box-shadow: none;
    }

    .bottom-left {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 16;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .glass-panel {
      background: var(--surface);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.8);
    }

    .legend {
      padding: 10px 12px 9px;
      min-width: 176px;
    }

    .legend-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 12px;
    }

    .legend-grid span {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-2);
      white-space: nowrap;
    }

    .legend-grid i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 8px -1px var(--c);
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
    }

    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-2);
      font-size: 15px;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }

    .ctrl-btn:active {
      transform: scale(0.94);
    }

    .divider-v {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 3px;
    }

    .graph-stats {
      font-size: 11.5px;
      color: var(--text-3);
      padding: 0 8px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .graph-stats.loading {
      color: #60a5fa;
      animation: breathe 1.6s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

    .side-drawer {
      position: fixed;
      top: 74px;
      bottom: 16px;
      z-index: 18;
      width: min(420px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(18, 27, 44, 0.94), rgba(12, 19, 32, 0.94));
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.9);
      transition: transform 0.32s var(--ease), opacity 0.28s var(--ease);
      user-select: text;
      overflow: hidden;
    }

    #node-drawer {
      left: 16px;
      width: min(368px, calc(100vw - 32px));
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }

    #node-drawer.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    #answer-drawer {
      right: 16px;
      transform: translateX(calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }

    #answer-drawer.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .drawer-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-2);
    }

    .drawer-title::before {
      content: "";
      width: 3px;
      height: 13px;
      border-radius: 2px;
      background: linear-gradient(180deg, #60a5fa, #6366f1);
    }

    .close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-3);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }

    .close-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--text);
    }

    .drawer-body::-webkit-scrollbar,
    .evidence-pre::-webkit-scrollbar {
      width: 5px;
    }

    .drawer-body::-webkit-scrollbar-track,
    .evidence-pre::-webkit-scrollbar-track {
      background: transparent;
    }

    .drawer-body::-webkit-scrollbar-thumb,
    .evidence-pre::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.22);
      border-radius: 4px;
    }

    .drawer-body::-webkit-scrollbar-thumb:hover,
    .evidence-pre::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }

    .type-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--accent-soft);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.22);
    }

    .node-title {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #fff;
      margin: 8px 0 6px;
      word-break: break-word;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--text-3);
    }

    .meta-row b {
      color: var(--text-2);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      margin: 20px 0 9px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .surface-block {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 9px;
      padding: 11px 13px;
      margin-bottom: 8px;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.72;
    }

    .neighbor-row {
      padding: 9px 11px;
      background: var(--card);
      border: 1px solid transparent;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }

    .neighbor-row:hover {
      background: var(--card-hover);
      border-color: rgba(96, 165, 250, 0.25);
      transform: translateX(2px);
    }

    .neighbor-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
    }

    .neighbor-name::before {
      content: "→";
      color: #60a5fa;
      flex-shrink: 0;
    }

    .neighbor-desc {
      margin-top: 3px;
      font-size: 11.5px;
      line-height: 1.55;
      color: var(--text-2);
      word-break: break-word;
    }

    .chunk-id {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10.5px;
      color: #60a5fa;
      margin-bottom: 5px;
      letter-spacing: 0.03em;
    }

    .chunk-text {
      font-size: 12px;
      line-height: 1.68;
      color: var(--text-2);
      white-space: pre-wrap;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .node-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--highlight-soft);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.24);
      cursor: pointer;
      transition: all 0.16s var(--ease);
      max-width: 100%;
    }

    .node-chip:hover {
      background: rgba(245, 158, 11, 0.28);
      border-color: rgba(245, 158, 11, 0.5);
      transform: translateY(-1px);
    }

    .query-echo {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.14), rgba(99, 102, 241, 0.09));
      border: 1px solid rgba(96, 165, 250, 0.22);
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.6;
      color: #dbeafe;
      word-break: break-word;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: #93c5fd;
      font-weight: 600;
      line-height: 1.45;
      margin: 16px 0 8px;
    }

    .markdown-body h1 {
      font-size: 15.5px;
    }

    .markdown-body h2 {
      font-size: 14.5px;
    }

    .markdown-body h3,
    .markdown-body h4 {
      font-size: 13.5px;
    }

    .markdown-body>*:first-child {
      margin-top: 0;
    }

    .markdown-body p {
      margin-bottom: 10px;
      line-height: 1.75;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 20px;
      margin-bottom: 10px;
    }

    .markdown-body li {
      margin-bottom: 5px;
      line-height: 1.7;
    }

    .markdown-body li::marker {
      color: #60a5fa;
    }

    .markdown-body strong {
      color: #fff;
      font-weight: 600;
    }

    .markdown-body em {
      color: #cbd5e1;
    }

    .markdown-body code {
      background: rgba(96, 165, 250, 0.12);
      color: #93c5fd;
      padding: 1.5px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    .markdown-body pre {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .markdown-body blockquote {
      border-left: 3px solid rgba(96, 165, 250, 0.5);
      padding-left: 12px;
      margin: 10px 0;
      color: var(--text-2);
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 14px 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      font-size: 12.5px;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 6px 9px;
      text-align: left;
    }

    .markdown-body th {
      background: rgba(96, 165, 250, 0.1);
      color: #93c5fd;
      font-weight: 600;
    }

    details.raw-evidence {
      margin-top: 18px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }

    details.raw-evidence summary {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 13px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-2);
      list-style: none;
      transition: color 0.16s var(--ease), background 0.16s var(--ease);
    }

    details.raw-evidence summary::-webkit-details-marker {
      display: none;
    }

    details.raw-evidence summary::before {
      content: "▸";
      font-size: 10px;
      color: #60a5fa;
      transition: transform 0.2s var(--ease);
    }

    details.raw-evidence[open] summary::before {
      transform: rotate(90deg);
    }

    details.raw-evidence summary:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .evidence-pre {
      margin: 0;
      padding: 12px 13px;
      border-top: 1px solid var(--border);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-2);
      max-height: 280px;
      overflow-y: auto;
    }

    .empty-hint {
      padding: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      border: 1px dashed var(--border);
      border-radius: 9px;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.14), transparent);
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(4, 7, 13, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.24s var(--ease);
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-card {
      width: min(420px, 100%);
      background: linear-gradient(180deg, #131d31 0%, #0e1626 100%);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 26px 24px 24px;
      box-shadow: 0 32px 80px -24px rgba(0, 0, 0, 0.95);
      position: relative;
      overflow: hidden;
      animation: modalIn 0.34s var(--ease);
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, #6366f1, transparent);
    }

    .modal-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.22), rgba(99, 102, 241, 0.18));
      border: 1px solid rgba(96, 165, 250, 0.28);
      color: #93c5fd;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.01em;
      margin-bottom: 8px;
      color: #fff;
    }

    .modal-desc {
      font-size: 12.5px;
      line-height: 1.68;
      color: var(--text-2);
      margin-bottom: 20px;
    }

    .modal-desc code {
      background: rgba(96, 165, 250, 0.12);
      color: #93c5fd;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11.5px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    .modal-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 11px 13px;
      color: var(--text);
      font-size: 13.5px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.02em;

    @media (max-width: 720px) {

  </style>
</head>

<body>
  <div id="graph-container"></div>

  <div class="command-bar">
    <input id="search-input" type="text" placeholder="輸入問題檢索圖譜，自動提取證據鏈交由 agnes-2.5-flash 分析…" autocomplete="off"
      spellcheck="false" />
    <button id="key-btn" class="icon-btn" title="配置 API Key">

        stroke-linecap="round" stroke-linejoin="round">
