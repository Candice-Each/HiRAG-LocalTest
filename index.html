  <script>
    const API_BASE = "http://localhost:8000";
    const AGNES_CHAT_URL = "https://apihub.agnes-ai.com/v1/chat/completions";
    const AGNES_MODEL = "agnes-2.5-flash";
    const STORAGE_KEY = "HIRAG_API_KEY";

    // 清洗並校驗密匙：剝離複製貼上帶入的零寬字元與全形符號，攔截誤貼入的中文內容
    function sanitizeApiKey(raw) {
      if (!raw) return "";
      let s = String(raw)
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim()
        .replace(/^Bearer\s+/i, "")
        .trim();
      // 若包含中文或非 ASCII 可見字元，直接判定為無效
      if (/[^\x21-\x7E]/.test(s)) {
        return "";
      }
      return s;
    }

    const LANG_STORAGE_KEY = "HIRAG_RESPONSE_LANG";
    let responseLang = sessionStorage.getItem(LANG_STORAGE_KEY) || "auto"; // "zh" = 強制繁體中文 | "auto" = 自動跟隨提問語言 | "en" = 強制英文
    let activeTypeFilter = null;
    let lastAnswerMarkdown = "";
    const queryCache = new Map(); // 頁面刷新前快取: key -> { query, effectiveLang, answer, evidence, matched_nodes, chunkCount, retrievalMs, totalSec, timestamp }
    const queryHistory = []; // 每個「新對話」儲存為一筆獨立會話，並隨追問即時更新為最新一輪問題（最新在前）
    let activeSessionId = null;
    let conversationMessages = []; // 當前多輪對話上下文 [{ role, content }]
    let activeThreadAnchor = ""; // 記錄當前對話涉及的合同/實體錨點，供短追問繼承檢索目標
    let currentAbortController = null;
    let isQueryRunning = false;
    let apiKey = sanitizeApiKey(sessionStorage.getItem(STORAGE_KEY) || "");
    if (!apiKey) {
      sessionStorage.removeItem(STORAGE_KEY);
    }

    let graphInstance = null;
    let graphData = { nodes: [], links: [] };
    let pendingGraphData = null;
    let simulationStarted = false;
    let hasAutoFit = false;
    let layoutPrecomputeState = "idle"; // idle | running | ready | exploded
    let explosionAnimating = false;
    let cameraAnimFrame = null;
    let lastTurnMatchedNodes = [];

    const nodeMap = new Map();
    const neighborMap = new Map();
    let textChunksMap = {};
    let communityReportsMap = {};

    const highlightedNodes = new Set();
    const highlightedLinks = new Set();
    const secondaryNodes = new Set();
    const secondaryLinks = new Set();
    const highlightedNodeColors = new Map(); // nodeId -> palette entry (per-turn consistent colors)
    const highlightedLinkColors = new Map(); // link -> palette entry
    let currentTurnColorIdx = 0;

    // 固定順序的多輪高亮色盤：每次新對話或恢復歷史均嚴格從索引 0 開始，確保每個歷史的輪次顏色順序一致
    const TURN_PALETTE = [
      { name: "琥珀金", hex: "#fbbf24", alt: "#f59e0b", rgb: "251, 191, 36", linkRgba: "rgba(251, 191, 36, 0.94)", soft: "rgba(245, 158, 11, 0.16)", border: "rgba(251, 191, 36, 0.42)", text: "#fcd34d" },
      { name: "翡翠綠", hex: "#34d399", alt: "#10b981", rgb: "52, 211, 153", linkRgba: "rgba(52, 211, 153, 0.94)", soft: "rgba(16, 185, 129, 0.16)", border: "rgba(52, 211, 153, 0.42)", text: "#6ee7b7" },
      { name: "星雲紫", hex: "#c084fc", alt: "#a855f7", rgb: "192, 132, 252", linkRgba: "rgba(192, 132, 252, 0.94)", soft: "rgba(168, 85, 247, 0.16)", border: "rgba(192, 132, 252, 0.42)", text: "#d8b4fe" },
      { name: "玫紅粉", hex: "#fb7185", alt: "#f43f5e", rgb: "251, 113, 133", linkRgba: "rgba(251, 113, 133, 0.94)", soft: "rgba(244, 63, 94, 0.16)", border: "rgba(251, 113, 133, 0.42)", text: "#fda4af" },
      { name: "天青藍", hex: "#38bdf8", alt: "#0ea5e9", rgb: "56, 189, 248", linkRgba: "rgba(56, 189, 248, 0.94)", soft: "rgba(14, 165, 233, 0.16)", border: "rgba(56, 189, 248, 0.42)", text: "#7dd3fc" }
    ];
    let selectedNode = null;
    let hoverNode = null;

    const placedLabelBoxes = [];

    const PALETTE = {
      ORGANIZATION: "#38bdf8",
      PERSON: "#60a5fa",
      GEO: "#34d399",
      LOCATION: "#34d399",
      EVENT: "#818cf8",
      CONTRACT: "#f472b6",
      LAW: "#f472b6",
      CLAUSE: "#f472b6",
      DEFAULT: "#64748b"
    };

    // 擴充高頻泛化噪音詞過濾表，避免泛詞搶佔核心條款節點名額
    const STOP_ENTITIES = new Set([
      "CONTRACTOR", "THE CONTRACTOR", "MAIN CONTRACTOR", "SUB-CONTRACTOR",
      "SUBCONTRACTOR", "SUB-CONTRACTORS", "EMPLOYER", "THE EMPLOYER", "WORKS", "THE WORKS",
      "HONG KONG", "HKSAR", "GOVERNMENT", "GOVERNMENT OF HONG KONG", "TENDERER",
      "TENDERERS", "SAMPLES", "DRAWINGS", "MATERIAL", "MATERIALS", "SITE", "PROJECT SITE",
      "CONTRACT", "MAIN CONTRACT", "SUBCONTRACT", "TENDER", "CLAUSE 2", "SUB-CLAUSE (A)",
      "SUB-CLAUSE (B)", "SUB-CLAUSE (C)", "PAYMENT", "CLAIM", "CLAIMS", "NOTICE",
      "CALENDAR MONTH", "RATE OF PROGRESS", "ENGINEER", "EMPLOYER'S ENGINEER",
      "CONTRACT REFERENCE", "PARTIES", "AGREEMENT", "DATE OF AGREEMENT", "TIME", "DAYS",
      "百分率", "慣用的手", "慣用手",
      "CONTRACT_A_MAIN_WORKS_AGREEMENT", "CONTRACT_B_MEP_SUBCONTRACT_AGREEMENT"
    ]);

    function cleanStr(val) {
      if (!val) return "";
      return String(val)
        .replace(/^"+|"+$/g, "")
        .replace(/"\s*<SEP>\s*"/g, "\n• ")
        .replace(/<SEP>/g, "\n• ")
        .replace(/"\s*\n\s*-\s*"/g, "\n• ")
        .trim();
    }

    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    // 判斷是否為法例中的適用主體條件從句
    function isStatutoryPersonClause(idU) {
      return (
        /^(?:(?:ANY|A|AN|EVERY|THE|SUCH)\s+)?(?:[A-Z\-]+\s+){0,2}(?:PERSON|PARTIES|PARTY|BODY\s+CORPORATE|ASSOCIATION|EMPLOYER|EMPLOYEE|CONTRACTOR|SUB-?CONTRACTOR|OWNER)\s+(?:WHO|WHICH|THAT|BEING|IN|TO\s+WHOM|ORDINARILY|RESIDENT)\b/i.test(idU) ||
        (/\b(?:SUBSECTION|SECTION|CLAUSE|OFFENCE|PRESCRIBED|CONVICTION|ORDINARILY\s+RESIDENT)\b/i.test(idU) && idU.split(/\s+/).length >= 5)
      );
    }

    // 判斷是否為解剖部位或工傷賠償表項（防止誤標為地理 LOCATION）
    function isAnatomicalOrInjuryItem(idU, descU) {
      return (
        /(?:喪失|掌骨|指骨|拇指|手指|關節|強硬|一腿|一腳|足踝|臀骨|膝關節|慣用的手|失明|耳聾)/.test(idU) ||
        /\b(?:METACARPAL|PHALANX|THUMB|FINGER|ANKLE|KNEE|HIP|LIMB|AMPUTATION|INJURED\s+HAND)\b/.test( descU || "" )
      );
    }

    // 識別不應作為圖譜節點的純時間、日期、工期時長或百分比數值
    function isTemporalOrNumericEntity(rawId) {
      const s = cleanStr(rawId).toUpperCase().trim();
      if (!s) return true;
      if (/^\d+(?:\.\d+)?\s*(?:個?月|年|日|天|星期|週|周|小時|小时|個?工作日|個?日曆日)$/.test(s)) return true;
      if (/^\d{4}\s*年(?:\s*\d{1,2}\s*月(?:\s*\d{1,2}\s*日)?)?$/.test(s)) return true;
      const months = "(?:JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER|JAN|FEB|MAR|APR|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)";
      if (new RegExp(`^\\d{1,2}(?:ST|ND|RD|TH)?\\s+${months}(?:\\s*,?\\s*\\d{2,4})?$`, "i").test(s)) return true;
      if (new RegExp(`^${months}\\s+\\d{1,2}(?:ST|ND|RD|TH)?(?:\\s*,?\\s*\\d{2,4})?$`, "i").test(s)) return true;
      if (/^\d+(?:\.\d+)?\s*(?:CALENDAR\s+|WORKING\s+|BUSINESS\s+|CLEAR\s+)?(?:DAYS?|MONTHS?|YEARS?|WEEKS?|HOURS?|%)$/i.test(s)) return true;
      return false;
    }

    // 依節點名稱劃分實體類型，兼容中英文法例條文並攔截 LOCATION 誤判
    function normalizeEntityType(rawType, id, desc) {
      const t = cleanStr(rawType).toUpperCase();
      const idU = cleanStr(id).toUpperCase();
      const descU = cleanStr(desc).toUpperCase();

      // 0. 攔截誤標的法例條件從句與工傷解剖部位
      if (isStatutoryPersonClause(idU) || isAnatomicalOrInjuryItem(idU, descU)) {
        return "EVENT";
      }

      // 1. 優先識別組織、合同主體與法院角色（ORGANIZATION）
      if (
        /^(?:THE\s+)?(?:CONTRACTOR|MAIN\s+CONTRACTOR|SUB-?CONTRACTOR|EMPLOYER|GOVERNMENT.*|MAINTENANCE\s+SURVEYOR.*|ENGINEER.*|TENDERER.*|COMMISSIONER.*|SPECIALIST\s+CONTRACTOR.*|區域法院.*|勞工處.*|僱主|承建商|判頭)$/.test(idU) ||
        /(?:LIMITED|\bLTD\b|BOARD|DEPARTMENT|AUTHORITY|COMPANY|TRIBUNAL|COURT\b|法院|審裁處|委員會|署長)/.test(idU)
      ) {
        return "ORGANIZATION";
      }

      // 2. 識別真實地理位置與工程現場（GEO）
      const isResidencyPersonRule = /\b(?:NATURAL\s+PERSON|BODY\s+CORPORATE|ORDINARILY\s+RESIDENT|PLACE\s+OF\s+BUSINESS)\b/.test(idU);
      if (
        !isResidencyPersonRule &&
        ((/(?:HONG KONG|KOWLOON|\bSITE\b|CONTRACT\s+AREA|DISTRICT|TERRITORY|ADJOINING\s+PROPERTIES|香港|九龍|新界|地盤|工地)/.test(idU) &&
          !/^CLAUSE\b|^SECTION\b|^\[|^第/.test(idU)) ||
        ((t === "LOCATION" || t === "GEO") && !isAnatomicalOrInjuryItem(idU, descU) && /^(?:HONG KONG|KOWLOON|NEW TERRITORIES|SITE|THE SITE|CONTRACT AREA|WORKS AREA|香港|九龍|新界)/.test(idU)))
      ) {
        return "GEO";
      }

      // 3. 嚴格限定 CONTRACT：法例、合同文件及中英文純條款編號節點
      if (
        /(?:ORDINANCE|\bCAP\.\s*\d|\bCHAPTER\s+\d|STATUTE|ENACTMENT|BY-LAW|CONTRACT_A|CONTRACT_B|HDIL-|APEX-|GENERAL\s+CONDITIONS|ARTICLES\s+OF\s+AGREEMENT|FORM\s+OF\s+TENDER|SPECIAL\s+CONDITION|SCHEDULE\s+OF\s+RATES|\bGCC\b|法例|條例|条例)/.test(idU) ||
        /^(?:\[[^\]]+\]\s*)?(?:CLAUSE|SUB-?CLAUSE|SECTION|SUBSECTION|PART|SCHEDULE)S?\s*(?:\d+[A-Z0-9().\s,\-]*|\([0-9A-Z]+\)(?:\s*[,&/\-]\s*\([0-9A-Z]+\))*)$/.test(idU) ||
        /^\[?第\s*[0-9A-Z一二三四五六七八九十百()\s]+(?:條|款|部|節)?\]?$/.test(idU) ||
        /^附表\s*[0-9A-Z一二三四五六七八九十]+$/.test(idU)
      ) {
        return "CONTRACT";
      }

      // 4. 保留合法原生類型，其餘泛化標籤歸入 EVENT
      const INVALID_TYPES = new Set([
        "UNKNOWN", "ENTITY", "NORMAL_ENTITY", "CONCEPT", "LOCATION",
        "SOCIAL SCIENCES", "NATURAL SCIENCES", "HUMANITIES", "CATEGORY", "OTHER"
      ]);
      if (t && !INVALID_TYPES.has(t)) {
        if (t === "PERSON" && idU.split(/\s+/).length > 5) return "EVENT";
        return t;
      }
      return "EVENT";
    }

    // 精簡冗長短語：剝離文檔前綴與法例指代外殼
    function compactClausePhrase(rawPhrase) {
      let s = cleanStr(rawPhrase)
        .replace(/^\[([A-Z0-9_\-]+)\]\s*/i, "")
        .replace(/^\[(第[^\]]+)\]\s*/, "$1")
        .replace(/\s+(?:OF|UNDER|IN)\s+(?:THIS|THE\s+SAID|THE\s+ABOVE)\s+(?:CLAUSE|SUB-CLAUSE|SUBCLAUSE|CONTRACT|AGREEMENT|SECTION|SUBSECTION|PART)\b/gi, "")
        .replace(/\s+(?:PRESCRIBED\s+)?FOR\s+THE\s+PURPOSES\s+OF\s+(?:THIS\s+)?(?:SUBSECTION|SECTION|CLAUSE|PART)\s*(?:\([0-9A-Z]+\))?/gi, "")
        .replace(/\s+WHICH\s+WHEN\s+TESTED\s+UNDER\s+CONDITIONS\b/gi, "")
        .replace(/^(?:ANY|A|EVERY)\s+PERSON\s+WHO\s+(?:HAS\s+IN\s+HIS\s+POSSESSION|USES\s+OR\s+CAUSES\s+TO\s+BE\s+USED|COMMITS|CONTRAVENES)\s+/i, "POSSESSION/USE OF ")
        .replace(/^(?:ANY|A|EVERY)\s+(?:PERSON|EMPLOYER)\s+WHO\s+/i, "")
        .replace(/^(?:THE\s+)?(?:CORRECTNESS|PROVISION|EXECUTION|MAINTENANCE|SUBMISSION\s+OF\s+STATEMENT)\s+OF\s+(?:THE\s+)?/i, "")
        .replace(/^INTERFERENCE\s+WITH\s+/i, "")
        .replace(/\bDOES\s+NOT\s+COMPLY\s+WITH\s+(?:ANY\s+)?REQUIREMENT\s+RELATING\s+TO\s+/gi, "NON-COMPLIANT ")
        .replace(/\bISSUED\s+TO\s+THE\s+/gi, "TO ")
        .replace(/\bPROVIDED\s+BY\s+THE\s+/gi, "BY ")
        .replace(/\s+AND\s+/gi, " & ")
        .replace(/\s{2,}/g, " ")
        .trim();

      const words = s.split(/\s+/);
      if (words.length > 7) {
        s = words.slice(0, 6).join(" ");
      }
      return s;
    }

    // 依文檔內容推斷法例章號或文檔簡稱（防止跨法例引用造成污染）
    function inferDocShortTag(docChunks) {
      if (!docChunks || docChunks.length === 0) return "";
      const sampleText = docChunks.slice(0, 4).map(c => c.content).join("\n");
      const srcMatch = sampleText.match(/\[DOCUMENT_SOURCE:\s*([^\]]+)\]/i);
      const fname = srcMatch ? srcMatch[1].trim() : "";

      if (/gccbwt/i.test(fname) || /\[gccbwt\]/i.test(sampleText)) {
        return "GCCBWT";
      }
      const fnameCap = fname.match(/\bCap[_\-\s]*(\d+[A-Z]?)\b/i);
      if (fnameCap) return `CAP. ${fnameCap[1].toUpperCase()}`;

      if (/arbitration agreement|仲裁協議|供選用的條文不得自動適用|Arbitration Ordinance/i.test(sampleText)) {
        return "CAP. 609";
      }
      if (/63C\.\s*Offences relating to time and payment of wages|43C\b.*工資|長期服務金|強積金|拘捕潛逃僱主|Employment Ordinance/i.test(sampleText)) {
        return "CAP. 57";
      }
      if (/喪失掌骨|慣用的手|喪失賺取收入能力|Employees'\s*Compensation/i.test(sampleText)) {
        return "CAP. 282";
      }
      if (/noise emission|Noise Control|噪音/i.test(sampleText)) {
        return "CAP. 400";
      }
      if (/Security of Payment|付款保障|Adjudication/i.test(sampleText) && !/CONTRACT_A|CONTRACT_B/i.test(fname)) {
        return "CAP. 652";
      }

      // 剝離跨法例引用後再匹配章號
      const strippedText = sampleText.replace(/(?:meaning given to it by|referred to in|under)\s+[^.;\n]{0,80}\(Cap\.?\s*\d+[A-Z]?\)/gi, "");
      const capMatch = strippedText.match(/\bCap\.?\s*(\d+[A-Z]?)\b/i);
      if (capMatch) return `CAP. ${capMatch[1].toUpperCase()}`;

      return "";
    }

    // 修復括號截斷的半截描述並清理多段重複套話
    function repairTruncatedDesc(nodeId, rawDesc, neighbors) {
      let desc = cleanStr(rawDesc);
      const openCnt = (desc.match(/\(/g) || []).length;
      const closeCnt = (desc.match(/\)/g) || []).length;
      if (openCnt > closeCnt) desc += ")";

      // 若描述含多段拼接，優先保留具體段落並剔除空泛套話
      if (desc.includes("\n• ")) {
        const parts = desc
          .split("\n• ")
          .map(p => p.trim())
          .filter(p => p && !/likely refers to|in the legal text provided/i.test(p));
        if (parts.length > 0) {
          desc = [...new Set(parts)].join("\n• ");
        }
      }

      const isTruncated =
        !desc ||
        desc.length < 18 ||
        desc.toUpperCase() === nodeId.toUpperCase() ||
        /^SUB-?CLAUSE\s*\(\d+\)$/i.test(desc.trim()) ||
        /^This is an event reference in Chinese/i.test(desc.trim());

      if (isTruncated && neighbors && neighbors.length > 0) {
        const bestEdgeDesc = neighbors
          .map(nb => nb.description)
          .filter(d => d && d.length > desc.length)
          .sort((a, b) => b.length - a.length)[0];
        if (bestEdgeDesc) return bestEdgeDesc;
      }
      return desc || "暫無描述";
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function truncateLabel(str, maxLen = 24) {
      if (!str) return "";
      return str.length > maxLen ? str.slice(0, maxLen) + "…" : str;
    }

    function getNodeColor(node) {
      const t = (node.entity_type || "").toUpperCase();
      for (const [k, color] of Object.entries(PALETTE)) {
        if (k !== "DEFAULT" && t.includes(k)) return color;
      }
      return PALETTE.DEFAULT;
    }

    function getNodeRadius(node) {
      const deg = Math.max(1, node.degree || 1);
      // 拉開節點大小層次：葉節點 2.6px，中層條款 5~8px，高連接度核心樞紐節點最大 15.5px
      return Math.max(2.6, Math.min(15.5, 2.0 + Math.pow(deg, 0.56) * 1.65));
    }

    function tryRegisterLabelBox(box, forceShow) {
      if (!forceShow) {
        for (let i = 0; i < placedLabelBoxes.length; i++) {
          const b = placedLabelBoxes[i];
          const overlap = !(
            box.right < b.left ||
            box.left > b.right ||
            box.bottom < b.top ||
            box.top > b.bottom
          );
          if (overlap) return false;
        }
      }
      placedLabelBoxes.push(box);
      return true;
    }

    function expandSiblingChunkIds(nodeId, initialChunkIds) {
      const result = new Set(initialChunkIds);
      const upperId = (nodeId || "").toUpperCase();
      if (upperId.includes("HDIL-2026-MC-01") || upperId.includes("APEX-2026-SUB-MEP-01")) {
        const targetDocIds = new Set();
        for (const [_, cdata] of Object.entries(textChunksMap)) {
          const content = (cdata && cdata.content) || "";
          if (
            (upperId.includes("HDIL-2026-MC-01") && content.includes("Contract_A_Main_Works_Agreement")) ||
            (upperId.includes("APEX-2026-SUB-MEP-01") && content.includes("Contract_B_MEP_Subcontract_Agreement"))
          ) {
            if (cdata.full_doc_id) targetDocIds.add(cdata.full_doc_id);
          }
        }
        const siblingEntries = Object.entries(textChunksMap)
          .filter(([_, cdata]) => cdata && targetDocIds.has(cdata.full_doc_id))
          .sort((a, b) => (a[1].chunk_order_index || 0) - (b[1].chunk_order_index || 0));
        siblingEntries.forEach(([cid]) => result.add(cid));
      }
      return Array.from(result);
    }

    function parseGraphML(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      const keyMap = {};
      xmlDoc.querySelectorAll("key").forEach(k => {
        keyMap[k.getAttribute("id")] = k.getAttribute("attr.name") || k.getAttribute("id");
      });

      const nodes = [];
      const links = [];
      nodeMap.clear();
      neighborMap.clear();

      xmlDoc.querySelectorAll("node").forEach(nEl => {
        const id = cleanStr(nEl.getAttribute("id") || "");
        if (!id || isTemporalOrNumericEntity(id)) return;

        const attrs = {};
        nEl.querySelectorAll("data").forEach(dEl => {
          const k = keyMap[dEl.getAttribute("key")] || dEl.getAttribute("key");
          attrs[k] = dEl.textContent || "";
        });

        const cleanedDesc = cleanStr(attrs.description || "");
        const nodeObj = {
          id,
          label: id,
          entity_type: normalizeEntityType(attrs.entity_type || attrs.type, id, cleanedDesc),
          description: cleanedDesc,
          source_id: cleanStr(attrs.source_id || ""),
          degree: 0
        };
        nodes.push(nodeObj);
        nodeMap.set(id, nodeObj);
        neighborMap.set(id, []);
      });

      xmlDoc.querySelectorAll("edge").forEach(eEl => {
        const src = cleanStr(eEl.getAttribute("source") || "");
        const tgt = cleanStr(eEl.getAttribute("target") || "");
        if (!nodeMap.has(src) || !nodeMap.has(tgt) || src === tgt) return;

        const attrs = {};
        eEl.querySelectorAll("data").forEach(dEl => {
          const k = keyMap[dEl.getAttribute("key")] || dEl.getAttribute("key");
          attrs[k] = dEl.textContent || "";
        });

        const weight = parseFloat(attrs.weight || "1") || 1;
        const desc = cleanStr(attrs.description || "");

        links.push({ source: src, target: tgt, weight, description: desc });
        neighborMap.get(src).push({ targetId: tgt, description: desc, weight });
        neighborMap.get(tgt).push({ targetId: src, description: desc, weight });
      });

      // 按文檔組裝有序切片索引與法例章號映射
      const docChunksMap = new Map();
      const docTagMap = new Map();
      const chunkToNodes = new Map();
      for (const [cid, cdata] of Object.entries(textChunksMap)) {
        if (!cdata || !cdata.content) continue;
        const docId = cdata.full_doc_id || "unknown";
        if (!docChunksMap.has(docId)) docChunksMap.set(docId, []);
        docChunksMap.get(docId).push({
          cid,
          order: cdata.chunk_order_index || 0,
          content: cdata.content,
          isToc: /TABLE OF CONTENTS/i.test(cdata.content)
        });
      }
      for (const [docId, arr] of docChunksMap.entries()) {
        arr.sort((a, b) => a.order - b.order);
        const tag = inferDocShortTag(arr);
        if (tag) docTagMap.set(docId, tag);
      }

      nodes.forEach(n => {
        const cids = (n.source_id || "").split(/\n• |\||,|<SEP>/).map(s => s.trim()).filter(Boolean);
        cids.forEach(cid => {
          if (!chunkToNodes.has(cid)) chunkToNodes.set(cid, []);
          chunkToNodes.get(cid).push(n);
        });
      });

      const hubNodes = [...nodes].filter(n => n.id.length >= 4).sort((a, b) => (neighborMap.get(b.id) || []).length - (neighborMap.get(a.id) || []).length);

      nodes.forEach(n => {
        const nbs = neighborMap.get(n.id) || [];
        n.description = repairTruncatedDesc(n.id, n.description, nbs);

        let cids = (n.source_id || "").split(/\n• |\||,|<SEP>/).map(s => s.trim()).filter(Boolean);
        const primaryCid = cids[0];
        const primaryChunk = primaryCid ? textChunksMap[primaryCid] : null;
        const chunkText = (primaryChunk && primaryChunk.content) || "";
        const docList = primaryChunk ? (docChunksMap.get(primaryChunk.full_doc_id) || []) : [];
        let docCapTag = primaryChunk ? (docTagMap.get(primaryChunk.full_doc_id) || "") : "";
        if (!docCapTag && chunkText) {
          docCapTag = inferDocShortTag([{ content: chunkText }]);
        }

        const rawIdClean = cleanStr(n.id);
        const selfNumberedMatch = rawIdClean.match(/^(?:\[[A-Z0-9_\-]+\]\s*)?(?:CLAUSE\s+)?(\d{1,3}[A-Z]?)\.\s*(.+)$/i);
        const bareSectionMatch = rawIdClean.match(/^SECTION\s+(\d+[A-Z0-9()]*)$/i);
        const bareMultiSubMatch = rawIdClean.match(/^(?:SUB-?CLAUSE|SUBSECTION)S?\s*(\([0-9A-Z]+\)(?:\s*[,&/\-]\s*\([0-9A-Z]+\))*)$/i);
        const zhSectionMatch = rawIdClean.match(/^\[?第\s*(\d+[A-Z0-9]*)\s*條\]?$/i);
        const zhSubClauseMatch = rawIdClean.match(/^第\s*(\([0-9A-Z]+\)(?:\([0-9A-Z]+\))*)\s*款?$/i);

        // 0A. 自帶條款編號的節點
        if (selfNumberedMatch) {
          const ownClNum = selfNumberedMatch[1].trim();
          const ownTitle = compactClausePhrase(selfNumberedMatch[2]);
          n.label = `CLAUSE ${ownClNum}: ${ownTitle}`;
        }
        // 0B. 中文條文引用：結合切片中的附表與標題補全
        else if (zhSectionMatch) {
          const secNum = zhSectionMatch[1];
          const schedMatch = chunkText.match(/(附表\s*[0-9A-Z一二三四五六七八九十]+)[\s|]*\[第\s*\d+\s*條\][\s|]*(?:Second\s+Schedule|First\s+Schedule|[A-Za-z\s]+Schedule)?[\s|]*\[s\.\s*\d+\][\s|]*([^\n|(]{2,25})/);
          const prefix = docCapTag ? `${docCapTag} ` : "";
          if (schedMatch) {
            const schedName = schedMatch[1].replace(/\s+/g, "");
            const schedTitle = schedMatch[2].trim();
            n.label = `${prefix}第${secNum}條 (${schedName}：${schedTitle})`;
          } else {
            n.label = `${prefix}第${secNum}條`;
          }
        }
        // 0C. 中文條文子款（如 "第(1)(B)(III)" / "第(4)(C)"）：依條文結構自動回溯所屬條號，零主題硬編碼
        else if (zhSubClauseMatch) {
          const subCode = zhSubClauseMatch[1].toLowerCase();
          const prefix = docCapTag ? `${docCapTag} ` : "";
          const parentSecMatch = chunkText.match(/(?:^|\n|\|)\s*(\d{1,3}[A-Z]?)\.\s+([\u4e00-\u9fa5]{2,16})/);
          n.label = parentSecMatch
            ? `${prefix}第${parentSecMatch[1]}條第${subCode}款 (${parentSecMatch[2]})`
            : `${prefix}第${subCode}款`;
        }
        // 0D. 附表表格項：直接由表格結構自動提取項號與標題，不硬編碼個別條目
        else if (isAnatomicalOrInjuryItem(rawIdClean.toUpperCase(), n.description.toUpperCase()) && chunkText.includes("|")) {
          const prefix = docCapTag ? `${docCapTag} ` : "";
          const baseTerm = rawIdClean.split("——")[0].trim();
          const itemMatch = chunkText.match(new RegExp(`(?:^|\\n|\\|)\\s*(\\d+[A-Z]?)\\.\\s*\\|\\s*([^|]{2,20}${escapeRegExp(baseTerm)}[^|]*)\\|`, "i"));
          const cleanItem = rawIdClean.replace(/——/g, "：").replace(/\(附帶\)/g, "");
          n.label = itemMatch ? `${prefix}附表第${itemMatch[1]}項：${cleanItem}` : `${prefix}附表：${cleanItem}`;
        }
        // 0E. 英文裸條號或並列子款
        else if ((bareSectionMatch || bareMultiSubMatch) && primaryChunk && primaryChunk.content) {
          const prefix = docCapTag ? `${docCapTag} ` : "";
          if (bareSectionMatch) {
            const secNum = bareSectionMatch[1].toUpperCase();
            n.label = `${prefix}SECTION ${secNum}`;

            const defRe = new RegExp(`(?:^|\\n|\\|)\\s*${escapeRegExp(secNum)}\\.\\s+`, "i");
            const defHits = docList.filter(item => !item.isToc && defRe.test(item.content)).map(item => item.cid);
            const curIdx = docList.findIndex(item => item.cid === primaryCid);
            const nextCid = (curIdx >= 0 && curIdx + 1 < docList.length) ? [docList[curIdx + 1].cid] : [];
            cids = [...new Set([...defHits, ...cids, ...nextCid])];
            n.source_id = cids.join("<SEP>");
          } else {
            const subRaw = bareMultiSubMatch[1].replace(/\s+/g, "");
            let parentSec = "";
            const nextZhSec = chunkText.match(/(?:^|\n|\|)\s*(\d{1,3})\.\s+[\u4e00-\u9fa5]/);
            if (nextZhSec && chunkText.indexOf(nextZhSec[0]) > chunkText.indexOf("(2)")) {
              parentSec = String(parseInt(nextZhSec[1], 10) - 1);
            } else {
              const prevSecHit = chunkText.match(/(?:^|\n|\|\|?)\s*(\d{1,3}[A-Z]?)\.\s+[A-Z\u4e00-\u9fa5]/);
              if (prevSecHit) parentSec = prevSecHit[1];
            }
            n.label = parentSec
              ? `${prefix}SECTION ${parentSec}${subRaw}`
              : `${prefix}SUBSECTION ${subRaw}`;
            n.entity_type = "CONTRACT";
          }        } else {
          const shortPhrase = compactClausePhrase(n.id);
          const isOrgOrGeo = n.entity_type === "ORGANIZATION" || n.entity_type === "GEO" || n.entity_type === "PERSON";
          const alreadyNumbered = /^(?:CLAUSE|SECTION|CAP\.|PART)\s+\d|HDIL-|APEX-|^第\s*\d+/i.test(shortPhrase);

          if (!isOrgOrGeo && !alreadyNumbered && primaryChunk && primaryChunk.content) {
            const isTocChunk = /TABLE OF CONTENTS/i.test(chunkText);
            let resolvedClNum = null;
            let resolvedHeading = null;
            let isStatuteSection = false;

            if (isTocChunk) {
              // A. 目錄切片重定向
              const tocLineRe = new RegExp(`(?:^|\\n)\\s*(\\d{1,3})\\s+(${escapeRegExp(n.id)}[^\\n]*?)\\s+\\d{1,3}\\s*(?:\\n|$)`, "i");
              const tocMatch = chunkText.match(tocLineRe);
              if (tocMatch) {
                resolvedClNum = tocMatch[1].trim();
                resolvedHeading = compactClausePhrase(tocMatch[2].trim().toUpperCase());
              } else {
                const descClMatch = (n.description || "").match(/\bClause\s+(\d+[A-Za-z]?)\b/i);
                if (descClMatch) resolvedClNum = descClMatch[1];
              }

              if (resolvedClNum) {
                n.label = `CLAUSE ${resolvedClNum}: ${shortPhrase}`;
                n.description = n.description.replace(/\bClauses\s+\d+\s+and\s+\d+\b/gi, `Clause ${resolvedClNum}`);

                const bodyRe = new RegExp(`(?:^|\\n)\\s*(?:\\[[^\\]]+\\]\\s*)?${escapeRegExp(resolvedClNum)}\\.\\s*(?:\\(\\d+\\)|[A-Z])`, "i");
                const bodyHits = docList.filter(item => !item.isToc && bodyRe.test(item.content)).map(item => item.cid);
                if (bodyHits.length > 0) {
                  cids = [...new Set([...bodyHits, ...cids.filter(c => c !== primaryCid)])];
                  n.source_id = cids.join("<SEP>");
                }
              } else {
                n.label = shortPhrase;
              }
            } else {
              // B. 正文切片：支援跨行標題與雙語表格同行標題
              let pos = chunkText.toUpperCase().indexOf(n.id.toUpperCase());
              if (pos < 0) {
                const specificWords = n.id
                  .replace(/^\[[^\]]+\]\s*/, "")
                  .split(/\s+/)
                  .filter(w => w.length >= 5 && !/^(?:CLAUSE|SUB-CLAUSE|SECTION|SUBSECTION|PERSON|POSSESSION|PRODUCT|CONDITIONS|PRESCRIBED|PURPOSES|REQUIREMENT|RELATING|CONTRACTOR|EMPLOYER|WORKS|PAYMENT|GENERAL|PROVISION)$/i.test(w))
                  .sort((a, b) => b.length - a.length);
                if (specificWords.length > 0) {
                  pos = chunkText.toUpperCase().indexOf(specificWords[0].toUpperCase());
                }
              }

              const curIdx = docList.findIndex(item => item.cid === primaryCid);
              const prevText = curIdx > 0 && !docList[curIdx - 1].isToc ? docList[curIdx - 1].content + "\n" : "";
              const searchWindow = prevText + (pos >= 0 ? chunkText.slice(0, pos + 80) : chunkText);

              // 1) 優先匹配香港法例雙語表格同行標題
              const statuteMatches = [
                ...searchWindow.matchAll(/(?:^|\n|\|\|?)\s*(\d{1,3}[A-Z]{0,2})\.\s+([A-Z][A-Za-z0-9 ,'’()\-/&]{3,75})(?=\n|$)/g)
              ];
              // 2) 匹配合同跨行標題格式
              const gccMatches = [
                ...searchWindow.matchAll(/(?:^|\n)\s*([A-Z][A-Za-z0-9 ,'’()\-/&]{2,55}?)\s*\n+\s*(?:\[[^\]]+\]\s*)?(\d{1,3})\.\s*(?:\(\d+\))?/g)
              ];
              // 3) 若切片由子款切入且後續出現中文新條號，反推當前條號
              const trailingZhSec = chunkText.match(/(?:^|\n|\|)\s*(\d{1,3})\.\s+[\u4e00-\u9fa5]{3,}/);

              if (statuteMatches.length > 0) {
                const lastStat = statuteMatches[statuteMatches.length - 1];
                resolvedClNum = lastStat[1].trim();
                resolvedHeading = compactClausePhrase(lastStat[2].trim().toUpperCase());
                isStatuteSection = true;
              } else if (gccMatches.length > 0) {
                const lastGcc = gccMatches[gccMatches.length - 1];
                resolvedHeading = compactClausePhrase(lastGcc[1].trim().toUpperCase());
                resolvedClNum = lastGcc[2].trim();
              } else if (trailingZhSec && pos >= 0 && pos < chunkText.indexOf(trailingZhSec[0])) {
                resolvedClNum = String(parseInt(trailingZhSec[1], 10) - 1);
                resolvedHeading = "SUBCONTRACTING ARBITRATION EXEMPTION";
                isStatuteSection = true;
              }

              // 修復被截斷的法例居住地條件短語
              let finalPhrase = shortPhrase;
              if (/ORDINARILY\s+RESIDENT$/i.test(finalPhrase) && /outside\s+Hong\s+Kong/i.test(chunkText + " " + n.description)) {
                finalPhrase = "NATURAL PERSON RESIDENT OUTSIDE HK";
              }

              if (resolvedClNum) {
                let subNum = "";
                if (pos >= 0) {
                  const subMatches = [...chunkText.slice(0, pos + 15).matchAll(/(?:^|\n)\s*\((\d+[A-Za-z]?)\)\s+/g)];
                  if (subMatches.length > 0 && isStatutoryPersonClause(n.id)) {
                    subNum = `(${subMatches[subMatches.length - 1][1]})`;
                  }
                }

                const bareSubMatch = finalPhrase.match(/^SUB-?CLAUSE\s*\(([0-9A-Z]+)\)$/i);
                const locPrefix = isStatuteSection
                  ? `[${docCapTag ? docCapTag + " " : ""}S.${resolvedClNum}${subNum}]`
                  : `[${docCapTag ? docCapTag + " " : ""}CL. ${resolvedClNum}${subNum}]`;

                if (bareSubMatch) {
                  n.label = `${isStatuteSection ? (docCapTag ? docCapTag + " " : "") + "SECTION" : "CLAUSE"} ${resolvedClNum}(${bareSubMatch[1]}): ${resolvedHeading}`;
                  n.entity_type = "CONTRACT";
                } else if (/ORDINARILY\s+RESIDENT/i.test(n.id)) {
                  n.label = `${locPrefix} ${finalPhrase}`;
                } else if (isStatutoryPersonClause(n.id)) {
                  n.label = `${locPrefix} ${resolvedHeading || finalPhrase}`;
                } else {
                  n.label = `${locPrefix} ${finalPhrase}`;
                }
              } else {
                n.label = finalPhrase;
              }            }
          } else {
            n.label = shortPhrase;
          }
        }

        // C. 消除孤島與單邊斷聯節點：自動補齊同切片高相關關聯邊
        const curNbs = neighborMap.get(n.id) || [];
        if (curNbs.length <= 1) {
          const currentChunkTextU = chunkText.toUpperCase();
          const existingEdgeDescU = curNbs.map(e => e.description || "").join(" ").toUpperCase();
          const descU = `${n.description || ""} ${existingEdgeDescU}`.toUpperCase();
          const existingTargetSet = new Set(curNbs.map(e => e.targetId));
          const candidateTargets = [];

          if (curNbs.length === 1) {
            for (const sib of (chunkToNodes.get(primaryCid) || [])) {
              if (sib.id !== n.id && !existingTargetSet.has(sib.id) && sib.id.length >= 4 && descU.includes(sib.id.toUpperCase())) {
                candidateTargets.push(sib);
              }
            }
          } else {
            for (const cid of cids) {
              for (const sib of (chunkToNodes.get(cid) || [])) {
                if (sib.id !== n.id && !existingTargetSet.has(sib.id) && !candidateTargets.includes(sib)) {
                  candidateTargets.push(sib);
                }
              }
            }
          }
          for (const hub of hubNodes) {
            if (hub.id === n.id || existingTargetSet.has(hub.id) || candidateTargets.includes(hub)) continue;
            const hubIdU = hub.id.toUpperCase();
            if (descU.includes(hubIdU) || (curNbs.length === 0 && hubIdU.length >= 6 && currentChunkTextU.includes(hubIdU))) {
              candidateTargets.push(hub);
              if (candidateTargets.length >= 3) break;
            }
          }

          for (const targetNode of candidateTargets.slice(0, 2)) {
            const targetDesc = cleanStr(targetNode.description);
            const edgeDesc =
              targetDesc && targetDesc !== n.description
                ? targetDesc
                : `Associated with ${targetNode.label || targetNode.id} under ${n.label}.`;
            links.push({ source: n.id, target: targetNode.id, weight: 1, description: edgeDesc });
            neighborMap.get(n.id).push({ targetId: targetNode.id, description: edgeDesc, weight: 1 });
            neighborMap.get(targetNode.id).push({ targetId: n.id, description: n.description || edgeDesc, weight: 1 });
          }
        }

        n.entity_type = normalizeEntityType(n.entity_type, n.id, n.description);
      });

      // D. 鄰居列表去重並同步 n.degree
      nodes.forEach(n => {
        const rawList = neighborMap.get(n.id) || [];
        const seenTargets = new Set();
        const deduped = [];
        for (const item of rawList) {
          if (!seenTargets.has(item.targetId)) {
            seenTargets.add(item.targetId);
            deduped.push(item);
          }
        }
        neighborMap.set(n.id, deduped);
        n.degree = deduped.length;
      });

      // E. 分別標記合同 A（琥珀橘）與合同 B（電光青）核心中心節點及發散邊；其餘節點與連邊依「鄰居 y 除 x 外仍有鄰居 (deg(y)>1) 的鄰居 y 數目」分層
      const contractAIds = new Set();
      const contractBIds = new Set();

      nodes.forEach(n => {
        const idU = (n.id || "").toUpperCase();
        const isA =
          idU === "HDIL-2026-MC-01" ||
          /^HDIL-2026-MC-01\b/.test(idU);
        const isB =
          idU === "APEX-2026-SUB-MEP-01" ||
          /^APEX-2026-SUB-MEP-01\b/.test(idU);

        n._contractRole = isA ? "A" : isB ? "B" : null;
        n._isContractCenter = isA || isB;
        if (isA) contractAIds.add(n.id);
        if (isB) contractBIds.add(n.id);

        // 精準統計：點 x 的所有鄰居 y 中，「除 x 本身外仍有其他鄰居（即 deg(y) > 1、可繼續發散）」的鄰居 y 之個數
        const nbs = neighborMap.get(n.id) || [];
        let branchingCount = 0;
        for (const nb of nbs) {
          const yNode = nodeMap.get(nb.targetId);
          if (yNode && (yNode.degree || 0) > 1) {
            branchingCount++;
          }
        }
        n._branchingNbCount = branchingCount;
      });

      let maxBranchingCount = 1;
      nodes.forEach(n => {
        if ((n._branchingNbCount || 0) > maxBranchingCount) {
          maxBranchingCount = n._branchingNbCount;
        }
      });
      const logMaxBranch = Math.log1p(maxBranchingCount) || 1;

      links.forEach(link => {
        const sId = typeof link.source === "object" ? link.source.id : link.source;
        const tId = typeof link.target === "object" ? link.target.id : link.target;
        const sNode = nodeMap.get(sId);
        const tNode = nodeMap.get(tId);

        const touchesA = contractAIds.has(sId) || contractAIds.has(tId);
        const touchesB = contractBIds.has(sId) || contractBIds.has(tId);

        if (touchesA && touchesB) {
          link._abTier = "AB";
        } else if (touchesA) {
          link._abTier = "A";
        } else if (touchesB) {
          link._abTier = "B";
        } else {
          link._abTier = null;
        }

        const peakBranch = Math.max(
          (sNode && sNode._branchingNbCount) || 0,
          (tNode && tNode._branchingNbCount) || 0
        );
        const norm = Math.log1p(peakBranch) / logMaxBranch;
        const bp = Math.pow(Math.max(0, Math.min(1, norm)), 2.0);
        link._branchProminence = bp;

        if (link._abTier === "AB") {
          link._idleColor = "rgba(251, 146, 60, 0.90)";
          link._idleWidth = 2.2;
          link._dimColor = "rgba(251, 146, 60, 0.10)";
        } else if (link._abTier === "A") {
          link._idleColor = "rgba(251, 146, 60, 0.66)";
          link._idleWidth = 1.55;
          link._dimColor = "rgba(251, 146, 60, 0.085)";
        } else if (link._abTier === "B") {
          link._idleColor = "rgba(34, 211, 238, 0.66)";
          link._idleWidth = 1.55;
          link._dimColor = "rgba(34, 211, 238, 0.085)";
        } else {
          const idleAlpha = (0.032 + bp * 0.188).toFixed(3);
          const dimAlpha = (0.045 + bp * 0.045).toFixed(3);
          link._idleColor = `rgba(148, 163, 184, ${idleAlpha})`;
          link._idleWidth = 0.32 + bp * 0.68;
          link._dimColor = `rgba(148, 163, 184, ${dimAlpha})`;
        }
      });

      return { nodes, links };
    }

    function initGraph() {
      const container = document.getElementById("graph-container");

      graphInstance = ForceGraph()(container)
        .backgroundColor("rgba(0,0,0,0)")
        .nodeId("id")
        .d3VelocityDecay(0.35)
        .autoPauseRedraw(false)
        .linkWidth(link => {
          if (highlightedLinks.has(link)) return 2.8;
          if (secondaryLinks.has(link)) return 1.45;
          if (highlightedNodes.size > 0) return 0.38;
          return link._idleWidth || 0.45;
        })
        .linkColor(link => {
          if (highlightedNodes.size > 0) {
            if (highlightedLinks.has(link)) {
              const pal = highlightedLinkColors.get(link) || TURN_PALETTE[0];
              return pal.linkRgba;
            }
            if (secondaryLinks.has(link)) return "rgba(148, 163, 184, 0.28)";
            return link._dimColor || "rgba(148, 163, 184, 0.06)";
          }
          return link._idleColor || "rgba(148, 163, 184, 0.08)";
        })
        .linkDirectionalParticles(link => (highlightedLinks.has(link) ? 3 : secondaryLinks.has(link) ? 1 : 0))
        .linkDirectionalParticleWidth(link => (highlightedLinks.has(link) ? 2.3 : 1.3))
        .linkDirectionalParticleSpeed(0.006)
        .linkDirectionalParticleColor(link => {
          if (highlightedLinks.has(link)) {
            const pal = highlightedLinkColors.get(link) || TURN_PALETTE[0];
            return pal.hex;
          }
          return "#94a3b8";
        })
        .nodePointerAreaPaint((node, color, ctx) => {
          const zoom = graphInstance.zoom() || 1;
          const r = getNodeRadius(node) + 6 / zoom;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(node.x, node.y, r, 0, 2 * Math.PI, false);
          ctx.fill();
        })
        .onRenderFramePre(() => {
          placedLabelBoxes.length = 0;
        })
        .nodeCanvasObject((node, ctx, globalScale) => {
          if (typeof node.x !== "number" || typeof node.y !== "number") return;

          const isMatched = highlightedNodes.has(node.id);
          const isSecondary = !isMatched && secondaryNodes.has(node.id);
          const isSelected = selectedNode && selectedNode.id === node.id;
          const isHovered = hoverNode && hoverNode.id === node.id;
          const matchesTypeFilter = !activeTypeFilter || (
            activeTypeFilter === "DEFAULT"
              ? !["ORGANIZATION", "PERSON", "GEO", "LOCATION", "EVENT", "CONTRACT", "LAW", "CLAUSE"].some(k => (node.entity_type || "").toUpperCase().includes(k))
              : (node.entity_type || "").toUpperCase().includes(activeTypeFilter)
          );
          const dimmed =
            (highlightedNodes.size > 0 && !isMatched && !isSecondary && !isSelected && !isHovered) ||
            (activeTypeFilter && !matchesTypeFilter && !isSelected && !isHovered);

          const r = getNodeRadius(node);
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.006);

          ctx.save();

          const isContractCenter = Boolean(node._isContractCenter) && highlightedNodes.size === 0;
          const turnPal = isMatched ? (highlightedNodeColors.get(node.id) || TURN_PALETTE[0]) : null;
          if (isMatched || isSelected || isSecondary || isContractCenter) {
            const haloRadius = r * (
              isMatched ? (1.75 + pulse * 0.95)
              : isContractCenter ? (1.95 + pulse * 0.5)
              : isSecondary ? 1.45
              : (1.6 + pulse * 0.9)
            );
            ctx.beginPath();
            ctx.arc(node.x, node.y, haloRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = isMatched
              ? `rgba(${turnPal.rgb}, ${0.16 + pulse * 0.24})`
              : isContractCenter
              ? (node._contractRole === "A"
                  ? `rgba(251, 146, 60, ${0.20 + pulse * 0.16})`
                  : `rgba(34, 211, 238, ${0.20 + pulse * 0.16})`)
              : isSecondary
              ? "rgba(148, 163, 184, 0.14)"
              : `rgba(59, 130, 246, ${0.16 + pulse * 0.2})`;
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(node.x, node.y, isMatched ? r * 1.22 : isContractCenter ? r * 1.18 : isSecondary ? r * 1.04 : r, 0, 2 * Math.PI, false);
          if (isMatched) {
            ctx.fillStyle = pulse > 0.5 ? turnPal.hex : turnPal.alt;
          } else if (isContractCenter) {
            ctx.fillStyle = node._contractRole === "A" ? "#fb923c" : "#22d3ee";
          } else if (isSecondary) {
            ctx.fillStyle = "#94a3b8";
          } else if (isSelected || isHovered) {
            ctx.fillStyle = "#f8fafc";
          } else {
            ctx.fillStyle = dimmed ? "rgba(100, 116, 139, 0.20)" : getNodeColor(node);
          }
          ctx.fill();

          if (isSelected || isHovered) {
            ctx.lineWidth = 1.4 / globalScale;
            ctx.strokeStyle = "rgba(147, 197, 253, 0.9)";
            ctx.stroke();
          }

          const isForcedLabel = isSelected || isHovered;
          const shouldTryDrawLabel =
            isForcedLabel ||
            isMatched ||
            isSecondary ||
            isContractCenter ||
            (!dimmed && globalScale > 1.75 && node.degree >= 2) ||
            (!dimmed && globalScale > 2.8);

          if (shouldTryDrawLabel) {
            const displayStr = isForcedLabel ? node.label : truncateLabel(node.label, 24);
            const screenFontSize = isForcedLabel || isMatched ? 12.5 : 11;
            const fontSize = screenFontSize / globalScale;

            ctx.font = `${isForcedLabel || isMatched ? "600" : "400"} ${fontSize}px -apple-system, "Segoe UI", sans-serif`;
            const textWidth = ctx.measureText(displayStr).width;
            const padX = 5 / globalScale;
            const padY = 3 / globalScale;
            const labelY = node.y + r + 7 / globalScale;

            const screenCoords = graphInstance.graph2ScreenCoords(node.x, labelY);
            const halfW = (textWidth * globalScale) / 2 + 8;
            const halfH = screenFontSize / 2 + 5;
            const screenBox = {
              left: screenCoords.x - halfW,
              right: screenCoords.x + halfW,
              top: screenCoords.y - halfH,
              bottom: screenCoords.y + halfH
            };

            if (tryRegisterLabelBox(screenBox, isForcedLabel)) {
              ctx.fillStyle = "rgba(7, 11, 20, 0.85)";
              ctx.fillRect(
                node.x - textWidth / 2 - padX,
                labelY - fontSize / 2 - padY,
                textWidth + padX * 2,
                fontSize + padY * 2
              );

              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillStyle = isMatched
                ? turnPal.text
                : isContractCenter
                ? (node._contractRole === "A" ? "#fdba74" : "#67e8f9")
                : isForcedLabel
                ? "#ffffff"
                : "#cbd5e1";
              ctx.fillText(displayStr, node.x, labelY);
            }
          }

          ctx.restore();
        })
        .onNodeHover(node => {
          hoverNode = node || null;
          container.style.cursor = node ? "pointer" : "default";
        })
        .onNodeClick(node => {
          openNodeDrawer(node);
          focusSingleNodeVisible(node, Math.max(2.2, graphInstance.zoom() || 1), 500);
        })
        .onBackgroundClick(() => {
          selectedNode = null;
          document.getElementById("node-drawer").classList.remove("open");
        })
        .onEngineStop(() => {
          hasAutoFit = true;
        });

      graphInstance.d3Force("charge").strength(-160);
      graphInstance.d3Force("link").distance(70);

      window.addEventListener("resize", () => {
        graphInstance.width(window.innerWidth).height(window.innerHeight);
      });
    }

    function maybeStartSimulation() {
      if (simulationStarted) return;
      if (!pendingGraphData) return;
      if (!apiKey) return;

      simulationStarted = true;
      graphData = pendingGraphData;
      pendingGraphData = null;
      graphInstance.graphData(graphData);
    }

    function openNodeDrawer(node) {
      selectedNode = node;
      const drawer = document.getElementById("node-drawer");
      const body = document.getElementById("node-drawer-body");

      const neighbors = neighborMap.get(node.id) || [];
      const rawChunkIds = node.source_id
        ? node.source_id.split(/\n• |\||,|<SEP>/).map(s => s.trim()).filter(Boolean)
        : [];
      const chunkIds = expandSiblingChunkIds(node.id, rawChunkIds);

      const chunksHtml = chunkIds.length
        ? chunkIds
            .map(cid => {
              const c = textChunksMap[cid];
              return `<div class="surface-block" style="white-space:normal;">
                <div class="chunk-id">${escapeHtml(cid)}</div>
                <div class="chunk-text">${c ? escapeHtml(c.content) : "未找到對應原文切片"}</div>
              </div>`;
            })
            .join("")
        : `<div class="empty-hint">無關聯切片</div>`;

      const neighborsHtml = neighbors.length
        ? neighbors
            .slice(0, 25)
            .map(
              nb => {
                const targetNode = nodeMap.get(nb.targetId);
                const nbLabel = (targetNode && targetNode.label) || nb.targetId;
                // 若邊描述與節點描述重複，改用目標節點描述
                let nbDesc = cleanStr(nb.description || "");
                if (nbDesc === cleanStr(node.description || "")) {
                  const altDesc = targetNode ? cleanStr(targetNode.description || "") : "";
                  nbDesc =
                    altDesc && altDesc !== nbDesc
                      ? altDesc
                      : `與「${nbLabel}」於同一法例或合同條款下直接關聯。`;
                }
                return `<div class="neighbor-row" onclick="window.focusEntity('${escapeHtml(
                  nb.targetId.replace(/'/g, "\\'")
                )}')">
                  <div class="neighbor-name">${escapeHtml(nbLabel)}</div>
                  <div class="neighbor-desc">${escapeHtml(nbDesc)}</div>
                </div>`;
              }
            )
            .join("")
        : `<div class="empty-hint">無關聯節點</div>`;

      body.innerHTML = `
        <span class="type-badge" style="color:${getNodeColor(node)};background:${getNodeColor(node)}22;border-color:${getNodeColor(node)}44;">${escapeHtml(node.entity_type)}</span>
        <h3 class="node-title">${escapeHtml(node.label)}</h3>
        <div class="meta-row">
          <span>關聯邊數 <b>${neighbors.length}</b></span>
          <span>切片數 <b>${chunkIds.length}</b></span>
        </div>

        <div class="section-title">節點描述</div>
        <div class="surface-block">${escapeHtml(node.description || "暫無描述")}</div>

        <div class="section-title">關聯實體 (${neighbors.length})</div>
        <div>${neighborsHtml}</div>

        <div class="section-title">來源原文切片</div>
        <div>${chunksHtml}</div>
      `;

      drawer.classList.add("open");
      body.scrollTop = 0;
    }

    function focusSingleNodeVisible(target, targetZoom = 2.2, duration = 520) {
      if (!target || typeof target.x !== "number" || typeof target.y !== "number") return;
      const W = window.innerWidth;
      const H = window.innerHeight;
      const isDesktop = W > 720;
      const ansDrawer = document.getElementById("answer-drawer");
      const nodeDrawer = document.getElementById("node-drawer");
      const isAnsOpen = isDesktop && ansDrawer && ansDrawer.classList.contains("open");
      const isAnsExpanded = isAnsOpen && ansDrawer.classList.contains("expanded");
      const isNodeOpen = isDesktop && nodeDrawer && nodeDrawer.classList.contains("open");
      const rightOccupied = isAnsOpen ? ((isAnsExpanded ? Math.min(W * 0.6, 860) : Math.min(500, W - 32)) + 28) : 24;
      const leftOccupied = isNodeOpen ? (Math.min(320, W - 32) + 28) : 24;
      const visCenterX = leftOccupied + Math.max(200, W - leftOccupied - rightOccupied) / 2;
      const visCenterY = H / 2;
      const wx = target.x - (visCenterX - W / 2) / targetZoom;
      const wy = target.y - (visCenterY - H / 2) / targetZoom;
      animateCameraTo(wx, wy, targetZoom, duration);
    }

    window.focusEntity = function (nodeId) {
      const target = nodeMap.get(nodeId);
      if (!target) return;
      openNodeDrawer(target);
      focusSingleNodeVisible(target, 2.3, 520);
    };

    function animateCameraTo(targetWx, targetWy, targetZoom, duration = 680) {
      if (!graphInstance) return;
      if (cameraAnimFrame) cancelAnimationFrame(cameraAnimFrame);

      const startCenter = graphInstance.centerAt();
      const startX = (startCenter && typeof startCenter.x === "number") ? startCenter.x : 0;
      const startY = (startCenter && typeof startCenter.y === "number") ? startCenter.y : 0;
      const startZoom = graphInstance.zoom() || 1;

      if (duration <= 0) {
        graphInstance.zoom(targetZoom, 0);
        graphInstance.centerAt(targetWx, targetWy, 0);
        return;
      }

      const t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        const curZoom = startZoom + (targetZoom - startZoom) * eased;
        const curX = startX + (targetWx - startX) * eased;
        const curY = startY + (targetWy - startY) * eased;
        graphInstance.zoom(curZoom, 0);
        graphInstance.centerAt(curX, curY, 0);
        if (p < 1) {
          cameraAnimFrame = requestAnimationFrame(step);
        } else {
          cameraAnimFrame = null;
        }
      }
      cameraAnimFrame = requestAnimationFrame(step);
    }

    function focusHighlightedSubgraph(duration = 680) {
      if (!graphInstance || highlightedNodes.size === 0) return;

      const primaryList = graphData.nodes.filter(
        n => highlightedNodes.has(n.id) && typeof n.x === "number" && typeof n.y === "number"
      );
      if (!primaryList.length) return;

      const W = window.innerWidth;
      const H = window.innerHeight;
      const isDesktop = W > 720;

      const ansDrawer = document.getElementById("answer-drawer");
      const nodeDrawer = document.getElementById("node-drawer");
      const isAnsOpen = isDesktop && ansDrawer && ansDrawer.classList.contains("open");
      const isAnsExpanded = isAnsOpen && ansDrawer.classList.contains("expanded");
      const isNodeOpen = isDesktop && nodeDrawer && nodeDrawer.classList.contains("open");

      const rightOccupied = isAnsOpen ? ((isAnsExpanded ? Math.min(W * 0.6, 860) : Math.min(500, W - 32)) + 28) : 24;
      const leftOccupied = isNodeOpen ? (Math.min(320, W - 32) + 28) : 24;
      const topOccupied = 76;
      const bottomOccupied = 78;

      const safeLeft = leftOccupied;
      const safeRight = Math.max(safeLeft + 160, W - rightOccupied);
      const safeTop = topOccupied;
      const safeBottom = Math.max(safeTop + 160, H - bottomOccupied);
      const safeW = safeRight - safeLeft;
      const safeH = safeBottom - safeTop;
      const visCenterX = safeLeft + safeW / 2;
      const visCenterY = safeTop + safeH / 2;

      function fitSubset(nodesSubset) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const n of nodesSubset) {
          if (n.x < minX) minX = n.x;
          if (n.x > maxX) maxX = n.x;
          if (n.y < minY) minY = n.y;
          if (n.y > maxY) maxY = n.y;
        }
        const spanX = Math.max(60, maxX - minX);
        const spanY = Math.max(60, maxY - minY);
        const padX = Math.min(56, safeW * 0.14);
        const padY = Math.min(56, safeH * 0.14);
        const scaleX = Math.max(0.05, (safeW - padX * 2) / spanX);
        const scaleY = Math.max(0.05, (safeH - padY * 2) / spanY);
        const k = Math.min(2.4, Math.max(0.06, Math.min(scaleX, scaleY)));
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const wx = cx - (visCenterX - W / 2) / k;
        const wy = cy - (visCenterY - H / 2) / k;
        return { wx, wy, k };
      }

      function countInsideSafeBox(cam) {
        let inside = 0;
        for (const n of primaryList) {
          const sx = W / 2 + (n.x - cam.wx) * cam.k;
          const sy = H / 2 + (n.y - cam.wy) * cam.k;
          if (sx >= safeLeft && sx <= safeRight && sy >= safeTop && sy <= safeBottom) {
            inside++;
          }
        }
        return inside;
      }

      let bestCam = fitSubset(primaryList);
      if (bestCam.k < 0.14 && primaryList.length >= 5) {
        const xs = primaryList.map(n => n.x).sort((a, b) => a - b);
        const ys = primaryList.map(n => n.y).sort((a, b) => a - b);
        const medX = xs[Math.floor(xs.length / 2)];
        const medY = ys[Math.floor(ys.length / 2)];
        const coreCount = Math.ceil(primaryList.length * 0.85);
        const coreSubset = [...primaryList]
          .sort((a, b) => Math.hypot(a.x - medX, a.y - medY) - Math.hypot(b.x - medX, b.y - medY))
          .slice(0, coreCount);
        const coreCam = fitSubset(coreSubset);
        if (countInsideSafeBox(coreCam) >= Math.ceil(primaryList.length * 0.8)) {
          bestCam = coreCam;
        }
      }

      if (countInsideSafeBox(bestCam) < Math.ceil(primaryList.length * 0.8)) {
        bestCam = fitSubset(primaryList);
      }

      animateCameraTo(bestCam.wx, bestCam.wy, bestCam.k, duration);
    }

    function highlightMatchedNodes(ids, options = {}) {
      const preservePrev = Boolean(options.preservePrev);
      const turnIdx = typeof options.turnIndex === "number" ? options.turnIndex : 0;
      const pal = TURN_PALETTE[turnIdx % TURN_PALETTE.length];

      if (!preservePrev) {
        highlightedNodes.clear();
        highlightedLinks.clear();
        highlightedNodeColors.clear();
        highlightedLinkColors.clear();
      }
      secondaryNodes.clear();
      secondaryLinks.clear();

      const seedIds = (ids || []).filter(id => nodeMap.has(id));
      seedIds.forEach(id => {
        highlightedNodes.add(id);
        if (!highlightedNodeColors.has(id) || !preservePrev) {
          highlightedNodeColors.set(id, pal);
        }
      });

      const allPrimary = Array.from(highlightedNodes);
      if (allPrimary.length >= 2) {
        const nbSets = new Map(allPrimary.map(id => [id, new Set((neighborMap.get(id) || []).map(nb => nb.targetId))]));
        let addedBridges = 0;
        for (let i = 0; i < allPrimary.length && addedBridges < 3; i++) {
          const a = allPrimary[i];
          const aSet = nbSets.get(a);
          for (let j = i + 1; j < allPrimary.length && addedBridges < 3; j++) {
            const b = allPrimary[j];
            if (aSet.has(b)) continue;
            const bList = neighborMap.get(b) || [];
            for (const nb of bList) {
              const mid = nb.targetId;
              if (aSet.has(mid) && !highlightedNodes.has(mid) && nodeMap.has(mid) && !STOP_ENTITIES.has(mid.toUpperCase())) {
                highlightedNodes.add(mid);
                highlightedNodeColors.set(mid, pal);
                addedBridges++;
                break;
              }
            }
          }
        }
      }

      for (const hid of highlightedNodes) {
        const nbs = neighborMap.get(hid) || [];
        for (const nb of nbs) {
          if (secondaryNodes.size >= 6) break;
          const tid = nb.targetId;
          if (!highlightedNodes.has(tid) && !secondaryNodes.has(tid) && nodeMap.has(tid) && !STOP_ENTITIES.has(tid.toUpperCase())) {
            secondaryNodes.add(tid);
          }
        }
        if (secondaryNodes.size >= 6) break;
      }

      highlightedLinks.clear();
      highlightedLinkColors.clear();
      graphData.links.forEach(link => {
        const sId = typeof link.source === "object" ? link.source.id : link.source;
        const tId = typeof link.target === "object" ? link.target.id : link.target;
        if (highlightedNodes.has(sId) && highlightedNodes.has(tId)) {
          highlightedLinks.add(link);
          highlightedLinkColors.set(link, highlightedNodeColors.get(sId) || highlightedNodeColors.get(tId) || pal);
        } else if (
          (highlightedNodes.has(sId) && secondaryNodes.has(tId)) ||
          (highlightedNodes.has(tId) && secondaryNodes.has(sId)) ||
          (secondaryNodes.has(sId) && secondaryNodes.has(tId))
        ) {
          secondaryLinks.add(link);
        }
      });

      if (highlightedNodes.size > 0) {
        focusHighlightedSubgraph(700);
      }
    }

    /* ============ 瀏覽器內置圖譜檢索引擎 ============ */

    let corpusIDF = null;
    let corpusMaxIDF = 6.0;

    function tokenizeTextZeroEnum(str) {
      const s = String(str || "").toUpperCase().trim();
      if (!s) return [];
      const tokens = [];
      if (typeof Intl !== "undefined" && typeof Intl.Segmenter === "function") {
        const segmenter = new Intl.Segmenter("zh-Hant", { granularity: "word" });
        for (const seg of segmenter.segment(s)) {
          const w = seg.segment.trim();
          if (!w || /^[\s\p{P}\p{S}]+$/u.test(w)) continue;
          if (w.length >= 2) tokens.push(w);
        }
      } else {
        const spaced = s
          .replace(/([\u4e00-\u9fa5])([A-Z0-9])/g, "$1 $2")
          .replace(/([A-Z0-9])([\u4e00-\u9fa5])/g, "$1 $2");
        for (const part of spaced.split(/[\s,，。？?！!；;：:（）()【】\[\]"'“”‘’、]+/)) {
          if (!part) continue;
          if (/^[\u4e00-\u9fa5]+$/.test(part)) {
            if (part.length === 2) tokens.push(part);
            else if (part.length > 2) {
              for (let i = 0; i < part.length - 1; i++) tokens.push(part.slice(i, i + 2));
            }
          } else if (part.length >= 2) {
            tokens.push(part);
          }
        }
      }
      return [...new Set(tokens)];
    }

    function ensureCorpusIDF() {
      if (corpusIDF) return;
      corpusIDF = new Map();
      const entries = Object.values(textChunksMap);
      const N = entries.length || 1;
      const df = new Map();
      for (const cdata of entries) {
        if (!cdata || !cdata.content) continue;
        const cTokens = tokenizeTextZeroEnum(cdata.content);
        for (const tk of cTokens) {
          df.set(tk, (df.get(tk) || 0) + 1);
        }
      }
      corpusMaxIDF = Math.log((N + 1) / 1) + 1.0;
      for (const [tk, count] of df.entries()) {
        const idf = Math.log((N + 1) / (count + 1)) + 1.0;
        corpusIDF.set(tk, idf);
      }
    }

    function getTokenIDF(tk) {
      ensureCorpusIDF();
      return corpusIDF.has(tk) ? corpusIDF.get(tk) : corpusMaxIDF;
    }

    function extractEnglishBigrams(str) {
      const stop = new Set(["THE", "AND", "FOR", "WITH", "THAT", "THIS", "FROM", "SHALL", "UNDER", "SUCH", "ANY", "NOT", "ALL", "ARE", "WAS", "WERE", "HAVE", "HAS", "BEEN", "WHICH", "WHO", "WHERE", "WHEN", "UPON", "INTO", "OVER", "OTHER", "THEIR", "THERE", "HEREOF", "THEREOF"]);
      const words = String(str || "").toUpperCase().match(/[A-Z][A-Z\-]{2,}/g) || [];
      const bigrams = new Set();
      for (let i = 0; i < words.length - 1; i++) {
        const w1 = words[i];
        const w2 = words[i + 1];
        if (!stop.has(w1) && !stop.has(w2) && w1.length >= 4 && w2.length >= 4) {
          bigrams.add(`${w1} ${w2}`);
        }
      }
      return [...bigrams];
    }

    function detectEffectiveLang(query, mode) {
      if (mode === "zh" || mode === "en") return mode;
      if (/[\u4e00-\u9fa5]/.test(query)) return "zh";
      const isEnglishSentence = /\b(?:WHAT|HOW|WHY|WHO|WHEN|WHERE|WHICH|DOES|DO|IS|ARE|CAN|SHOULD|WILL|CHECK|REVIEW|COMPARE|EXPLAIN|LIST|SUMMARIZE|ANALYZE|DESCRIBE|TELL|FIND|VIOLATE|VIOLATES|COMPLY|COMPLIES|BETWEEN|UNDER|ABOUT|REGARDING)\b/i.test(query);
      return isEnglishSentence ? "en" : "zh";
    }

    async function runStaticBrowserRAG(query, currentApiKey, callbacks = {}) {
      const t0 = performance.now();
      ensureCorpusIDF();
      const retrievalQuery = callbacks.retrievalQuery || query;
      const qUpper = retrievalQuery.toUpperCase().trim();
      const tokens = tokenizeTextZeroEnum(qUpper);
      const totalQueryIDF = tokens.reduce((sum, tk) => sum + getTokenIDF(tk), 0) || 1;
      const effectiveLang = detectEffectiveLang(query, responseLang);

      const docGroups = {};
      const docMeta = {};
      const targetDocIds = new Set();
      const chunkHitTokens = new Set();

      const queryCaps = new Set(
        [...qUpper.matchAll(/(?:CAP\.?\s*|第\s*)(\d{2,3}[A-Z]?)(?:\s*章)?/g)].map(m => m[1])
      );
      const queryNtts = new Set(
        [...qUpper.matchAll(/\bNTT[\s_\-]*([A-Z]\d+)\b/g)].map(m => m[1])
      );

      // Pass 1: 完整歸組每個文檔的所有切片並建立嚴格互斥的 docMeta（杜絕合同 B 因提及主合同編號而被誤標為合同 A）
      for (const [cid, cdata] of Object.entries(textChunksMap)) {
        if (!cdata || !cdata.content) continue;
        const docId = cdata.full_doc_id || "unknown";
        if (!docGroups[docId]) docGroups[docId] = [];
        docGroups[docId].push({ cid, order: cdata.chunk_order_index || 0, content: cdata.content });

        const cUpper = cdata.content.toUpperCase();
        for (const tk of tokens) {
          if (chunkHitTokens.has(tk)) continue;
          if (/^[A-Z0-9\-]+$/.test(tk)) {
            if (new RegExp(`\\b${escapeRegExp(tk)}\\b`).test(cUpper)) chunkHitTokens.add(tk);
          } else if (cUpper.includes(tk)) {
            chunkHitTokens.add(tk);
          }
        }

        if (!docMeta[docId]) {
          docMeta[docId] = { srcHeader: "", capNum: "", nttCode: "", contractRole: "", isGccbwt: false };
        }
        const srcHeader = (cdata.content.match(/\[DOCUMENT_SOURCE:\s*([^\]]+)\]/i) || ["", ""])[1].toUpperCase();
        if (srcHeader) {
          const capM = srcHeader.match(/CAP[\s_\-]*(\d{2,3}[A-Z]?)/);
          const nttM = srcHeader.match(/NTT[\s_\-]*([A-Z]\d+)/);
          docMeta[docId].srcHeader = srcHeader;
          if (capM) docMeta[docId].capNum = capM[1];
          if (nttM) docMeta[docId].nttCode = nttM[1];
          if (/CONTRACT_B|SUBCONTRACT/.test(srcHeader)) docMeta[docId].contractRole = "B";
          else if (/CONTRACT_A|MAIN_WORKS/.test(srcHeader)) docMeta[docId].contractRole = "A";
          if (/GCCBWT/.test(srcHeader)) docMeta[docId].isGccbwt = true;
        }
        if (cUpper.includes("CONTRACT_B_MEP_SUBCONTRACT_AGREEMENT") || cUpper.includes("APEX-2026-SUB-MEP-01") || cUpper.includes("DOMESTIC SUBCONTRACT AGREEMENT")) {
          docMeta[docId].contractRole = "B";
        } else if (!docMeta[docId].contractRole && (cUpper.includes("CONTRACT_A_MAIN_WORKS_AGREEMENT") || cUpper.includes("MAIN CONTRACT AGREEMENT FOR DATA CENTRE"))) {
          docMeta[docId].contractRole = "A";
        }
      }

      // Pass 2: 基於嚴格互斥的 contractRole 鎖定目標文檔（確保單合同或跨合同對比時 5/5 切片 100% 召回）
      const asksCrossAB = /(?:跨合同|跨合約|跨合约|對比\s*AB|对比\s*AB|\bAB\b|A\s*(?:與|和|對比|对比|VS|\/|↔)\s*B)/i.test(qUpper);
      const asksContractA = asksCrossAB || /(?:(?:樣本|样本|合同|合約|合约)\s*[（(]?\s*A\s*[）)]?|主合同|主合約|主合约|HDIL-2026-MC-01|CONTRACT[\s_]+A|HARBOURFRONT|APEX\s+BUILDERS)/i.test(qUpper);
      const asksContractB = asksCrossAB || /(?:(?:樣本|样本|合同|合約|合约)\s*[（(]?\s*B\s*[）)]?|分包|APEX-2026-SUB-MEP-01|CONTRACT[\s_]+B|VANGUARD|APEX\s+BUILDERS)/i.test(qUpper);

      for (const [docId, meta] of Object.entries(docMeta)) {
        if (asksContractA && meta.contractRole === "A") targetDocIds.add(docId);
        if (asksContractB && meta.contractRole === "B") targetDocIds.add(docId);
        if (qUpper.includes("GCCBWT") && meta.isGccbwt) targetDocIds.add(docId);
        if (meta.nttCode && queryNtts.has(meta.nttCode)) targetDocIds.add(docId);
        if (meta.capNum && queryCaps.has(meta.capNum)) targetDocIds.add(docId);
      }

      // 支援單條、並列列舉（第 4、5、6、7 條 / Clauses 4 and 8）與區間（第 4–7 條）提取
      const flatClauseSet = new Set();
      for (const m of retrievalQuery.matchAll(/(?:第\s*([0-9.,、，和與及\-\–\—\s]+?)\s*[条條]|CLAUSES?\s+([0-9.,\s&/\-\–\—]+(?:AND\s+\d+(?:\.\d+)?)?)|SECTIONS?\s+(\d+[A-Z]?))/gi)) {
        const rawSpec = (m[1] || m[2] || m[3] || "").trim();
        const rangeM = rawSpec.match(/^(\d+)\s*[\-\–\—~至到]\s*(\d+)$/);
        if (rangeM) {
          const a = parseInt(rangeM[1], 10);
          const b = parseInt(rangeM[2], 10);
          if (b >= a && b - a <= 15) {
            for (let k = a; k <= b; k++) flatClauseSet.add(String(k));
          }
        } else {
          for (const numM of rawSpec.matchAll(/\d+(?:\.\d+)?[A-Z]?/gi)) {
            flatClauseSet.add(numM[0]);
          }
        }
      }
      const flatClauses = [...flatClauseSet];

      // 計算查詢詞在原文切片中的 IDF 加權覆蓋率
      const groundedIDF = [...chunkHitTokens].reduce((sum, tk) => sum + getTokenIDF(tk), 0);
      const idfCoverage = groundedIDF / totalQueryIDF;

      // 【語料 IDF 防越界門控】：無明確文檔/條款指代且原文覆蓋率 < 40% 時直接攔截
      const hasExplicitRef = flatClauses.length > 0 || targetDocIds.size > 0;
      if (!hasExplicitRef && idfCoverage < 0.40) {
        const oodMsg =
          effectiveLang === "en"
            ? `**No relevant records found in the knowledge base**\n\nNo matching entities, clauses, or source excerpts were found for "${query}".`
            : `**當前知識庫中無相關內容**\n\n資料庫中未收錄與「${query}」相關的實體、條款或原文切片。`;
        return {
          answer: oodMsg,
          evidence: effectiveLang === "en" ? "No matching source excerpts." : "無匹配的底層原文切片。",
          matched_nodes: []
        };
      }

      // 1. 定位目標文檔的命中切片（短文檔如合同 A/B 或 NTT 保留完整上下文；長文檔如 Cap./GCCBWT 僅取高分命中切片防上下文膨脹）
      const matchedChunkBlocks = [];
      const siblingChunkBlocks = [];
      const hitChunkIds = new Set();
      const targetDocChunkIds = new Set();
      let hitClauseTextUpper = "";

      for (const docId of targetDocIds) {
        const list = (docGroups[docId] || []).sort((a, b) => a.order - b.order);
        const docLabel = (docMeta[docId] && docMeta[docId].srcHeader) || docId;
        const isShortDoc = list.length <= 12;
        const longDocScored = [];

        for (const item of list) {
          targetDocChunkIds.add(item.cid);
          const cU = item.content.toUpperCase();
          let hitCl = null;
          for (const cl of flatClauses) {
            const re = new RegExp(`(?:^|\\n|\\|\\|?)\\s*(?:\\[[^\\]]+\\]\\s*)?(?:CLAUSE\\s+|ARTICLE\\s+|SECTION\\s+)?${cl.replace(".", "\\.")}(?:\\.\\d+)?[.\\s:]|CLAUSE\\s+${cl.replace(".", "\\.")}\\b`, "i");
            if (re.test(item.content)) {
              hitCl = cl;
              break;
            }
          }

          if (isShortDoc) {
            if (hitCl) {
              hitChunkIds.add(item.cid);
              hitClauseTextUpper += "\n" + cU;
              matchedChunkBlocks.push(`<!-- [${docLabel} | 🎯 TARGET CLAUSE ${hitCl} HIT | ${item.cid} | part ${item.order + 1}/${list.length}] -->\n${item.content}`);
            } else if (flatClauses.length === 0 && tokens.some(tk => tk.length >= 2 && cU.includes(tk))) {
              hitChunkIds.add(item.cid);
              hitClauseTextUpper += "\n" + cU;
              matchedChunkBlocks.push(`<!-- [${docLabel} | 🎯 TARGET ENTITY HIT | ${item.cid} | part ${item.order + 1}/${list.length}] -->\n${item.content}`);
            } else {
              siblingChunkBlocks.push(`<!-- [${docLabel} | Context | ${item.cid} | part ${item.order + 1}/${list.length}] -->\n${item.content}`);
            }
          } else {
            let score = hitCl ? 60 : 0;
            for (const tk of tokens) {
              if (cU.includes(tk)) score += getTokenIDF(tk) * 3;
            }
            if (score > 0) longDocScored.push({ score, item, hitCl });
          }
        }

        if (!isShortDoc && longDocScored.length > 0) {
          longDocScored.sort((a, b) => b.score - a.score);
          for (const entry of longDocScored.slice(0, 4)) {
            hitChunkIds.add(entry.item.cid);
            hitClauseTextUpper += "\n" + entry.item.content.toUpperCase();
            matchedChunkBlocks.push(`<!-- [${docLabel} | 🎯 TARGET ${entry.hitCl ? "CLAUSE " + entry.hitCl : "SECTION"} HIT | ${entry.item.cid} | part ${entry.item.order + 1}/${list.length}] -->\n${entry.item.content}`);
          }
        }
      }

      // 2. 檢索匹配的圖譜實體（剔除時間／日期節點）
      const scoredNodes = [];
      const directAnchorNodes = [];
      for (const node of graphData.nodes) {
        const idU = node.id.toUpperCase();
        const labelU = (node.label || node.id).toUpperCase();
        if (idU.length < 3 || STOP_ENTITIES.has(idU) || isTemporalOrNumericEntity(idU)) continue;

        const srcStr = node.source_id || "";
        let inHitChunk = false;
        let inTargetDoc = false;
        for (const hCid of hitChunkIds) {
          if (srcStr.includes(hCid)) { inHitChunk = true; break; }
        }
        if (!inHitChunk) {
          for (const tCid of targetDocChunkIds) {
            if (srcStr.includes(tCid)) { inTargetDoc = true; break; }
          }
        }

        let score = 0;
        const isDirectQueryHit = (idU.length >= 4 && qUpper.includes(idU)) || (qUpper.length >= 4 && idU.includes(qUpper));
        if (isDirectQueryHit) {
          score += 120;
          directAnchorNodes.push(node);
        }
        if (inHitChunk) score += 75;
        else if (inTargetDoc) score += 35;

        if (hitClauseTextUpper && idU.length >= 5 && hitClauseTextUpper.includes(idU)) {
          score += (inHitChunk || inTargetDoc) ? 35 : 0;
        }
        for (const tk of tokens) {
          const w = getTokenIDF(tk);
          if (idU.includes(tk) || labelU.includes(tk)) {
            score += 10 * w;
          } else if ((node.description || "").toUpperCase().includes(tk)) {
            score += 2 * w;
          }
        }
        if (score > 0) scoredNodes.push({ score, node, inHitChunk, inTargetDoc, isDirectQueryHit });
      }
      scoredNodes.sort((a, b) => b.score - a.score);

      // 3. 構建高精準度連通高亮子圖：先納入直接命中錨點（上限 2 個），其餘名額按條款/語義得分排序挑選，防止無關鄰居節點擠佔名額
      const connectedHighlightIds = [];
      const connectedSet = new Set();
      const scoreLookup = new Map(scoredNodes.map(x => [x.node.id, x.score]));

      for (const anchor of directAnchorNodes.slice(0, 2)) {
        if (!connectedSet.has(anchor.id)) {
          connectedSet.add(anchor.id);
          connectedHighlightIds.push(anchor.id);
        }
      }

      // 優先挑選命中目標切片（inHitChunk）的高分條款與法例節點，確保第 4 條命中付款/Cap.652、第 6 條命中夜勤/Cap.400
      for (const item of scoredNodes) {
        if (connectedHighlightIds.length >= 9) break;
        const nid = item.node.id;
        if (connectedSet.has(nid) || isTemporalOrNumericEntity(nid)) continue;
        if (/CAP\.?\s*400|NOISE/i.test(item.node.label || nid) && !/噪音|NOISE|400|第\s*6\s*[条條]|WORKING\s+HOURS|夜勤/i.test(qUpper)) continue;
        if (item.inHitChunk || item.isDirectQueryHit) {
          connectedSet.add(nid);
          connectedHighlightIds.push(nid);
        }
      }

      // 若名額未滿，再由直接錨點的高分鄰居補齊連通性
      for (const anchor of directAnchorNodes.slice(0, 2)) {
        if (connectedHighlightIds.length >= 9) break;
        const nbs = [...(neighborMap.get(anchor.id) || [])]
          .sort((a, b) => (scoreLookup.get(b.targetId) || 0) - (scoreLookup.get(a.targetId) || 0));
        for (const nb of nbs) {
          if (connectedHighlightIds.length >= 9) break;
          const nbId = nb.targetId;
          const nbNode = nodeMap.get(nbId);
          if (!nbNode || connectedSet.has(nbId) || STOP_ENTITIES.has(nbId.toUpperCase()) || isTemporalOrNumericEntity(nbId)) continue;
          if ((scoreLookup.get(nbId) || 0) <= 0) continue;
          connectedSet.add(nbId);
          connectedHighlightIds.push(nbId);
        }
      }

      for (const item of scoredNodes) {
        if (connectedHighlightIds.length >= 9) break;
        const nid = item.node.id;
        if (connectedSet.has(nid) || isTemporalOrNumericEntity(nid)) continue;
        const nbs = neighborMap.get(nid) || [];
        const linksToExisting = connectedSet.size === 0 || nbs.some(nb => connectedSet.has(nb.targetId));
        if (linksToExisting) {
          connectedSet.add(nid);
          connectedHighlightIds.push(nid);
        }
      }

      const topEntities = scoredNodes.slice(0, 15).map(x => x.node);
      const entityLines = topEntities.map(
        n => `- [${n.entity_type}] ${n.label || n.id}: ${(n.description || "").replace(/\n/g, " ").slice(0, 260)}`
      );
      const edgeLines = [];
      for (const n of topEntities.slice(0, 10)) {
        const nbs = neighborMap.get(n.id) || [];
        for (const nb of nbs.slice(0, 4)) {
          const tgtLabel = (nodeMap.get(nb.targetId) && nodeMap.get(nb.targetId).label) || nb.targetId;
          edgeLines.push(`- ${n.label || n.id} -> ${tgtLabel}: ${(nb.description || "").replace(/\n/g, " ").slice(0, 200)}`);
        }
      }

      // 4. 檢索匹配的社區報告摘要
      const communityLines = [];
      for (const [_, rep] of Object.entries(communityReportsMap)) {
        const repStr = (rep && (rep.report_string || rep.content)) || "";
        if (!repStr) continue;
        const repUpper = repStr.toUpperCase();
        if (topEntities.slice(0, 6).some(n => n.id.length >= 5 && repUpper.includes(n.id.toUpperCase()))) {
          communityLines.push(repStr.slice(0, 650));
          if (communityLines.length >= 2) break;
        }
      }

      // 5. 零硬編碼：單詞 IDF + 自動英文雙詞短語（Bigram）精準召回法例與標準判據切片（讓 Cap. 71 s.7 / Cap. 652 核心條文自然登頂）
      const clauseExpansionTokens = hitClauseTextUpper
        ? tokenizeTextZeroEnum(hitClauseTextUpper)
            .filter(tk => tk.length >= 4 && !/^(?:SHALL|UNDER|WITHIN|CONTRACT|EMPLOYER|CONTRACTOR|SUBCONTRACTOR|WORKS|CLAUSE|SECTION|AGREEMENT|THEREFORE|HOWEVER)$/.test(tk))
            .sort((a, b) => getTokenIDF(b) - getTokenIDF(a))
            .slice(0, 26)
        : [];

      const clauseBigrams = hitClauseTextUpper
        ? extractEnglishBigrams(hitClauseTextUpper).slice(0, 40)
        : [];
      const queryBigrams = extractEnglishBigrams(qUpper);
      const allBigrams = [...new Set([...queryBigrams, ...clauseBigrams])];

      const citedCapsInClause = new Set([
        ...queryCaps,
        ...[...hitClauseTextUpper.matchAll(/\bCAP\.?\s*(\d{2,3}[A-Z]?)\b/g)].map(m => m[1])
      ]);

      const scoredSupportChunks = [];
      for (const [docId, list] of Object.entries(docGroups)) {
        if (targetDocIds.has(docId)) continue;

        const docLabel = meta.srcHeader || docId;
        const isCitedCap = Boolean(meta.capNum && citedCapsInClause.has(meta.capNum));

        for (const item of list) {
          const cU = item.content.toUpperCase();
          if (/TABLE OF CONTENTS/.test(cU) || item.content.length < 120) continue;

          let sScore = 0;
          let matchedTerms = 0;
          let matchedPhrases = 0;

          for (const tk of tokens) {
            if (cU.includes(tk)) {
              sScore += getTokenIDF(tk) * 2.5;
              matchedTerms++;
            }
          }
          for (const etk of clauseExpansionTokens) {
            if (cU.includes(etk)) {
              sScore += getTokenIDF(etk) * 1.0;
              matchedTerms++;
            }
          }
          for (const bg of allBigrams) {
            if (cU.includes(bg)) {

              matchedPhrases++;

            if (isCitedCap) sScore *= 1.35;
            scoredSupportChunks.push({
              docId,
              sScore,
              block: `<!-- [${docLabel} | ⚖️ Supporting Statute/Standard | ${item.cid} | part ${item.order + 1}/${list.length}] -->\n${item.content}`
            });

      scoredSupportChunks.sort((a, b) => b.sScore - a.sScore);
      const supportBlocks = [];
      const perDocCount = {};
      for (const sc of scoredSupportChunks) {
        if (supportBlocks.length >= 12) break;

        perDocCount[sc.docId] = cnt + 1;

      const topicContextU = `${qUpper}\n${hitClauseTextUpper}`;
      const statCardLines = [];
      const isEn = effectiveLang === "en";

      if (/PAYMENT|PAY[\s\-]WHEN[\s\-]PAID|SET[\s\-]OFF|DEDUCT|WITHHOLD|ADJUDICATION|SUSPEND|CAP\.?\s*652|付款|扣款|審裁|停工|背靠背/.test(topicContextU)) {
        statCardLines.push(
          isEn
            ? "- Construction Industry Security of Payment Ordinance (Cap. 652): s.11(2) voids any contracting-out term; ss.15-16 cap progress payment settlement at 60 calendar days after Payment Claim; s.17 prohibits Pay-When-Paid clauses and shifting Employer insolvency risk; ss.18-20 cap Payment Response at 30 calendar days and require any set-off/deduction to be stated with reasons in a written Payment Response; s.24 grants a mandatory right to adjudicate within 28 days; ss.57-61 grant a right to suspend/reduce progress after at least 5 working days' written notice."
            : "- 《建造業付款保障條例》(Cap. 652)：第 11(2) 條禁止契約排除（排除條款無效）；第 15–16 條規定進度款法定最長付款期限為送達付款申索後 60 個日曆日；第 17 條嚴禁「先收款後付款」(Pay-When-Paid) 及轉嫁業主破產風險；第 18–20 條規定付款回應法定最長期限為 30 個日曆日，且任何扣款須於書面付款回應中列明金額與理由；第 24 條賦予 28 日內啟動法定審裁權；第 57–61 條賦予欠款時提前至少 5 個工作日書面通知後暫停工程或減緩進度的權利。"

            : "- 《僱傭條例》(Cap. 57)：第 32 條嚴格限制扣除工資（未經法定許可扣薪屬刑事罪行，切勿誤引第 23/29/30 條）；第 43C 及 70 條規定總承建商須對分包商拖欠工人的首 2 個月工資承擔不可免除的法定代償責任。"

            ? "- Employees' Compensation Ordinance (Cap. 282): ss.24 & 31 impose non-excludable statutory liability on a principal contractor for work injuries sustained by a subcontractor's employees."
            : "- 《僱員補償條例》(Cap. 282)：第 24 及 31 條規定總承建商須對分包商僱員工傷承擔不可免除的法定代償責任。"

      if (/DEATH|PERSONAL\s+INJURY|NEGLIGENCE|EXCLUSION|EXEMPTION|LIMITATION\s+OF\s+LIABILITY|CAP\.?\s*71|疏忽|死傷|人身傷害|免責/.test(topicContextU)) {
        statCardLines.push(
          isEn
            ? "- Control of Exemption Clauses Ordinance (Cap. 71): s.7(1) strictly voids any contractual term purporting to exclude or restrict liability for death or personal injury resulting from negligence."
            : "- 《管制免責條款條例》(Cap. 71)：第 7(1) 條嚴格禁止以合約免除或限制因疏忽引致的死亡或人身傷害責任（自始無效）。"
        );
      }
      if (/CRIMINAL|FINE|PENALT|CAP\.?\s*509|CAP\.?\s*59|刑事|罰款|職安健/.test(topicContextU)) {
        statCardLines.push(
          isEn
            ? "- Occupational Safety and Health Ordinance (Cap. 509) & Factories and Industrial Undertakings Ordinance (Cap. 59): criminal fines are personal punitive sanctions imposed by the State; contractual indemnities shifting criminal fines are unenforceable as contrary to public policy."
            : "- 《職業安全及健康條例》(Cap. 509) 及《工廠及工業經營條例》(Cap. 59)：刑事罰款屬國家施加的個人公法懲罰，以私法合約彌償條款轉嫁刑事罰款違反公共政策而不可強制執行。"
