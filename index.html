      }

      const statCardSection = statCardLines.length
        ? (isEn
            ? `\n\n---Relevant Hong Kong Statutory Reference Index---\n${statCardLines.join("\n")}`
            : `\n\n---相關香港成文法例客觀條號索引---\n${statCardLines.join("\n")}`)
        : "";

      const systemPrompt = isEn
        ? `${evidenceText}${statCardSection}

---Evidence-Grounded Analysis Guidelines (STRICT ENGLISH ONLY)---
1. Output Language: Write the ENTIRE response strictly in formal English (including all headings, table headers, and analysis). Do NOT output any Chinese characters or Chinese punctuation/brackets, even if the query or source excerpts contain Chinese.
2. Strict Evidence Grounding: Base every clause number, statutory section number, figure, deadline, and legal conclusion strictly on the retrieved source excerpts and the Statutory Reference Index above. Never invent unrelated ordinances or foreign statutory time limits.
3. Comprehensive Cross-Checking: When reviewing a contract for internal contradictions or comparing contracts, systematically inspect ALL retrieved chunks from start to finish (including later clauses and schedules) covering price, retention, completion/liquidated damages, working hours, equipment/title, sub-subcontracting, and dispute resolution—do not omit any conflicting clause.
4. Adaptive Structure: Use concise English Markdown tables for compliance reviews, conflict checks, or comparisons; use clear bullet points or concise prose for factual lookups, definitions, or procedural questions.
5. Strict Dataset Boundary (Zero World-Knowledge Leakage): If the subject (e.g., external companies, executives, general trivia, news, or anything absent from the retrieved excerpts) is not grounded in the evidence above, NEVER answer from pre-trained general knowledge; reply ONLY: "No relevant records found in the knowledge base."`
        : `${evidenceText}${statCardSection}

---證據溯源分析規則（嚴格繁體中文）---
1. 輸出語言：全程嚴格使用標準**香港繁體中文**作答（專有名詞、公司名與條款編號可保留英文對照），絕不可混入任何簡體字（例如須寫「屬、明確、書面、風險、作業、欠付」，切勿寫成「属、明确、书面、风险、作业、演付」），且中英文混排時 Markdown 加粗星號兩側勿留多餘空格。
2. 嚴格依據檢索證據：所有條款編號、法例條號、金額、期限與合規結論必須嚴格源自上方檢索切片與法例條號索引。嚴禁猜測或編造無關法例名稱（切勿憑空引用無關條例或外地天數）。
3. 全面逐段核查：審查合同內部自相矛盾或跨合同衝突時，務必通讀全部檢索切片（含後半部條款及附表 Schedule），完整比對金額、保留金、**竣工日期與違約金**、施工時段、設備與所有權、轉判限制及爭議解決條款，切勿遺漏任何衝突。
4. 自適應表達格式：面對合規審查、條款衝突或跨文檔對比類問題，使用結構化繁體中文表格搭配簡明總結；面對事實查詢、實體概覽、定義解釋或程序類問題，直接以清晰條列或簡潔段落回覆。
5. 嚴格資料庫邊界（防幻覺鎖）：若問題涉及的人、企業、新聞或常識（例如科技公司高管、天氣、股價、娛樂等）未出現在上方檢索切片中，嚴禁動用預訓練常識作答，必須且僅能回覆：「當前知識庫中無相關內容」。`;

      const cleanKey = sanitizeApiKey(currentApiKey);
      if (!cleanKey) {
        apiKey = "";
        sessionStorage.removeItem(STORAGE_KEY);
        openApiKeyModal();
        throw new Error("密匙格式無效，已自動清除，請重新輸入。");
      }

      const retrievalMs = Math.max(1, Math.round(performance.now() - t0));
      const totalRetrievedChunks = matchedChunkBlocks.length + siblingChunkBlocks.length + supportBlocks.length;
      if (callbacks.onRetrieved) {
        callbacks.onRetrieved({
          retrievalMs,
          matchedNodes: connectedHighlightIds,
          chunkCount: totalRetrievedChunks,
          evidence: evidenceText
        });
      }

      // 真實 SSE 流式輸出（stream: true）＋ 異常自動降級非流式重試，呈現 Gemini / DeepSeek 級逐字流暢閱讀體驗
      let answer = "";
      for (let attempt = 0; attempt < 2; attempt++) {
        const useStream = attempt === 0 && typeof callbacks.onToken === "function";
        const priorTurns = Array.isArray(callbacks.historyMessages)
          ? callbacks.historyMessages.slice(-4).map(m => ({
              role: m.role,
              content: String(m.content || "").slice(0, 1400)
            }))
          : [];
        const llmResp = await fetch(AGNES_CHAT_URL, {
          method: "POST",
          signal: callbacks.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${cleanKey}`
          },
          body: JSON.stringify({
            model: AGNES_MODEL,
            temperature: attempt === 0 ? 0.0 : 0.15,
            max_tokens: 4096,
            stream: useStream,
            messages: [
              { role: "system", content: systemPrompt },
              ...priorTurns,
              { role: "user", content: query }
            ]
          })
        });

        if (!llmResp.ok) {
          throw new Error(`檢索服務暫時無法連線 (代碼 ${llmResp.status})`);
        }

        const ctype = (llmResp.headers.get("content-type") || "").toLowerCase();
        if (useStream && ctype.includes("text/event-stream") && llmResp.body) {
          const reader = llmResp.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          let streamed = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const rawLine of lines) {
              const line = rawLine.trim();
              if (!line || !line.startsWith("data:")) continue;
              const payload = line.slice(5).trim();
              if (payload === "[DONE]") continue;
              try {
                const parsed = JSON.parse(payload);
                const delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta;
                const piece = (delta && delta.content) || "";
                if (piece) {
                  streamed += piece;
                  callbacks.onToken(streamed);
                }
              } catch (_) {}
            }
          }
          answer = streamed.trim();
        } else {
          const llmData = await llmResp.json();
          const msg = llmData.choices && llmData.choices[0] && llmData.choices[0].message;
          answer = ((msg && (msg.content || msg.reasoning_content)) || "").trim();
          if (answer && callbacks.onToken) callbacks.onToken(answer);
        }
        if (answer) break;
      }

      if (!answer) {
        throw new Error(
          effectiveLang === "en"
            ? "The analysis service returned an empty response. Please try submitting the query again."
            : "檢索服務回傳內容為空，請重新點擊「檢索」再試一次。"
        );
      }

      return {
        answer,
        evidence: evidenceText,
        matched_nodes: connectedHighlightIds
      };
    }

    /* ============ 查詢入口與對話式流式渲染 ============ */

    function renderMarkdownClean(mdText, isStreaming = false) {
      const rawHtml = window.marked
        ? marked.parse(mdText || "")
        : `<div style="white-space:pre-wrap;">${escapeHtml(mdText || "")}</div>`;
      const wrappedHtml = rawHtml
        .replace(/<table/g, '<div class="table-wrap"><table')
        .replace(/<\/table>/g, "</table></div>");
      return isStreaming ? `${wrappedHtml}<span class="streaming-cursor"></span>` : wrappedHtml;
    }

    function setQuickPromptsVisible(visible) {
      const qp = document.getElementById("quick-prompts");
      if (qp) qp.classList.toggle("hidden-bar", !visible);
    }

    function setCommandBarCollapsed(collapsed) {
      const bar = document.getElementById("command-bar");
      if (bar) bar.classList.toggle("collapsed", Boolean(collapsed));
    }

    function normalizeCacheKey(q, lang) {
      const norm = String(q || "").trim().replace(/\s+/g, " ").toUpperCase();
      return `${norm}__${lang}`;
    }

    function updateHistoryUI() {
      const badge = document.getElementById("history-badge");
      const listEl = document.getElementById("history-list");
      const cacheHint = document.getElementById("cache-stats-hint");

      if (badge) {
        badge.textContent = String(queryHistory.length);
        badge.classList.toggle("visible", queryHistory.length > 0);
      }
      if (cacheHint) {
        cacheHint.textContent = `已存 ${queryHistory.length} 組對話 · 快取 ${queryCache.size} 筆`;
      }
      if (!listEl) return;

      if (!queryHistory.length) {
        listEl.innerHTML = `<div class="empty-hint">尚無對話紀錄，每次新對話將自動存檔並同步最新一輪問題。</div>`;
        return;
      }

      listEl.innerHTML = queryHistory
        .map((sess, idx) => {
          const isCurrent = sess.id === activeSessionId;
          const lastTurn = sess.turns[sess.turns.length - 1] || {};
          const nodeCnt = (lastTurn.matched_nodes || []).length;
          return `
          <button type="button" class="history-item ${isCurrent ? "active-session" : ""}" data-history-idx="${idx}">
            <div class="history-item-q">${escapeHtml(sess.latestQuery || sess.firstQuery || "")}</div>
            <div class="history-item-meta">
              ${sess.turns.length > 1 ? `<span class="turn-count-pill">${sess.turns.length} 問</span>` : ""}
              <span>${escapeHtml(sess.timeStr || "")}</span>
              <span>· ${nodeCnt} 節點</span>
              ${isCurrent ? `<span class="cache-pill">目前對話</span>` : `<span class="cache-pill">⚡ 已快取</span>`}
            </div>
          </button>
        `;
        })
        .join("");

      listEl.querySelectorAll(".history-item").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.historyIdx, 10);
          const sess = queryHistory[idx];
          if (!sess) return;
          document.getElementById("history-popover").classList.remove("open");
          restoreSessionFromHistory(sess);
        });
      });
    }

    function upsertSessionTurn(turnRecord, isFollowUp) {
      // 同步寫入單輪快取（供新對話重複問同題時 0ms 命中）
      const cKey = normalizeCacheKey(turnRecord.query, turnRecord.effectiveLang);
      queryCache.set(cKey, turnRecord);

      let sess = isFollowUp && activeSessionId
        ? queryHistory.find(s => s.id === activeSessionId)
        : null;

      if (!sess) {
        const newId = `sess_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        sess = {
          id: newId,
          firstQuery: turnRecord.query,
          latestQuery: turnRecord.query,
          effectiveLang: turnRecord.effectiveLang,
          anchor: turnRecord.anchor || turnRecord.query,
          timeStr: turnRecord.timeStr,
          turns: [turnRecord]
        };
        activeSessionId = newId;
        queryHistory.unshift(sess);
        if (queryHistory.length > 30) queryHistory.pop();
      } else {
        sess.turns.push(turnRecord);
        // 每次追問自動將該歷史紀錄標題更新為對應對話的最新一輪問題，並置頂
        sess.latestQuery = turnRecord.query;
        sess.effectiveLang = turnRecord.effectiveLang;
        sess.anchor = turnRecord.anchor || sess.anchor;
        sess.timeStr = turnRecord.timeStr;
        const pos = queryHistory.indexOf(sess);
        if (pos > 0) {
          queryHistory.splice(pos, 1);
          queryHistory.unshift(sess);
        }
      }
      updateHistoryUI();
    }

    // 重建問答框右側多輪刻度條，點擊任意刻度即平滑跳轉至對應輪次問題位置
    function updateTurnRuler() {
      const ruler = document.getElementById("turn-ruler");
      const body = document.getElementById("answer-drawer-body");
      const tip = document.getElementById("ruler-floating-tip");
      if (!ruler || !body) return;

      const turns = Array.from(body.querySelectorAll(".chat-turn"));
      if (!turns.length) {
        ruler.innerHTML = "";
        ruler.classList.remove("visible");
        if (tip) tip.classList.remove("visible");
        return;
      }

      ruler.classList.add("visible");
      ruler.innerHTML = turns
        .map((el, idx) => {
          const pal = TURN_PALETTE[idx % TURN_PALETTE.length];
          return `<button type="button" class="ruler-tick" data-turn-idx="${idx}"
            style="--tick-color:${pal.hex};--tick-soft:${pal.soft};--tick-border:${pal.border};--tick-text:${pal.text};"
            aria-label="跳轉至問題 ${idx + 1}">${idx + 1}</button>`;
        })
        .join("");

      const ticks = Array.from(ruler.querySelectorAll(".ruler-tick"));
      ticks.forEach((tickBtn, idx) => {
        const targetTurn = turns[idx];
        const qText = (targetTurn && targetTurn.dataset.query) || `第 ${idx + 1} 輪問題`;

        tickBtn.addEventListener("mouseenter", () => {
          if (!tip) return;
          const rect = tickBtn.getBoundingClientRect();
          tip.innerHTML = `<strong style="color:${TURN_PALETTE[idx % TURN_PALETTE.length].text};">#${idx + 1}</strong> ${escapeHtml(truncateLabel(qText, 56))}`;
          tip.style.top = `${Math.max(12, Math.min(window.innerHeight - 64, rect.top - 4))}px`;
          tip.style.right = `${window.innerWidth - rect.left + 10}px`;
          tip.classList.add("visible");
        });

        tickBtn.addEventListener("mouseleave", () => {
          if (tip) tip.classList.remove("visible");
        });

        tickBtn.addEventListener("click", () => {
          if (!targetTurn) return;
          const targetTop = Math.max(0, targetTurn.offsetTop - 12);
          body.scrollTo({ top: targetTop, behavior: "smooth" });
          targetTurn.classList.remove("turn-flash");
          void targetTurn.offsetWidth;
          targetTurn.classList.add("turn-flash");
          setTimeout(() => targetTurn.classList.remove("turn-flash"), 950);
          syncActiveRulerTick(idx);
        });
      });

      syncActiveRulerTick();
    }

    function syncActiveRulerTick(forcedIdx = null) {
      const ruler = document.getElementById("turn-ruler");
      const body = document.getElementById("answer-drawer-body");
      if (!ruler || !body) return;
      const ticks = Array.from(ruler.querySelectorAll(".ruler-tick"));
      if (!ticks.length) return;

      let activeIdx = forcedIdx;
      if (activeIdx === null) {
        const turns = Array.from(body.querySelectorAll(".chat-turn"));
        const viewAnchor = body.scrollTop + Math.min(110, body.clientHeight * 0.25);
        activeIdx = 0;
        for (let i = 0; i < turns.length; i++) {
          if (turns[i].offsetTop <= viewAnchor) {
            activeIdx = i;
          } else {
            break;
          }
        }
      }
      ticks.forEach((t, i) => t.classList.toggle("active", i === activeIdx));
    }

    function smartScrollDrawerToBottom(bodyEl) {
      if (!bodyEl) return;
      const distFromBottom = bodyEl.scrollHeight - bodyEl.scrollTop - bodyEl.clientHeight;
      if (distFromBottom < 140) {
        bodyEl.scrollTop = bodyEl.scrollHeight;
      }
    }

          followBtn.classList.add("stop-mode");
        } else {
          followBtn.textContent = "追問";
          followBtn.classList.remove("stop-mode");
        }
      }
    }

    function createChatTurn(query, turnIdx = 0) {
      const drawer = document.getElementById("answer-drawer");
      const body = document.getElementById("answer-drawer-body");
      drawer.classList.add("open");
      setQuickPromptsVisible(false);
      setCommandBarCollapsed(true);

      const turnEl = document.createElement("div");
      turnEl.className = "chat-turn";
      turnEl.dataset.query = query;
      turnEl.dataset.turnIdx = String(turnIdx);
      turnEl.innerHTML = `
        <div class="user-bubble-wrap">
          <div class="user-bubble">${escapeHtml(query)}</div>
        </div>
        <div class="assistant-card">
          <div class="assistant-meta">
            <span class="assistant-badge"><span class="assistant-spark" style="color:${TURN_PALETTE[turnIdx % TURN_PALETTE.length].text};background:${TURN_PALETTE[turnIdx % TURN_PALETTE.length].soft};border-color:${TURN_PALETTE[turnIdx % TURN_PALETTE.length].border};">✦</span>合規檢索分析</span>
            <span class="latency-tag js-latency">檢索中…</span>
          </div>
          <details class="trace-box" open>
            <summary>
              <span class="trace-dot pulse js-trace-dot"></span>
              <span class="js-trace-title">正在檢索知識圖譜與原文切片…</span>
            </summary>
            <div class="trace-steps js-trace-steps">
              <div class="trace-step running">掃描圖譜拓撲與語料 IDF 索引…</div>
            </div>
          </details>
          <div class="chip-wrap js-chips" style="display:none;"></div>
          <div class="assistant-prose markdown-body js-prose"></div>
          <div class="turn-footer js-footer" style="display:none;">
            <button type="button" class="turn-action-btn js-copy-turn">複製此結論</button>
            <button type="button" class="turn-action-btn js-regen-turn">重新生成</button>
          </div>
          <details class="raw-evidence js-evidence-box" style="display:none;">
            <summary>查看檢索證據鏈</summary>
            <pre class="evidence-pre js-evidence-pre"></pre>
          </details>
        </div>
      `;
      body.appendChild(turnEl);
      updateTurnRuler();
      body.scrollTop = body.scrollHeight;
      syncActiveRulerTick(turnIdx);
      return turnEl;
    }

    function renderChipsInto(container, matchedIds, turnIdx = 0) {
      const matched = matchedIds || [];
      if (!matched.length) {
        container.style.display = "none";
        return;
      }
      const fallbackPal = TURN_PALETTE[turnIdx % TURN_PALETTE.length];
      container.style.display = "flex";
      container.innerHTML = matched
        .map(id => {
          const pal = highlightedNodeColors.get(id) || fallbackPal;
          const chipLabel = (nodeMap.get(id) && nodeMap.get(id).label) || id;
          return `<span class="node-chip" style="background:${pal.soft};color:${pal.text};border-color:${pal.border};" onclick="window.focusEntity('${escapeHtml(
            id.replace(/'/g, "\\'")
          )}')">✦ ${escapeHtml(truncateLabel(chipLabel, 28))}</span>`;
        })
        .join("");
    }

    function bindTurnFooterActions(turnEl, query, answerText, options = {}) {
      const copyTurnBtn = turnEl.querySelector(".js-copy-turn");
      const regenTurnBtn = turnEl.querySelector(".js-regen-turn");
      if (copyTurnBtn) {
        copyTurnBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(answerText || "");
            copyTurnBtn.textContent = "✓ 已複製";
            setTimeout(() => { copyTurnBtn.textContent = "複製此結論"; }, 1600);
          } catch (_) {}
        });
      }
      if (regenTurnBtn) {
        regenTurnBtn.addEventListener("click", () => {
          if (isQueryRunning) return;
          runQuery(query, { forceRefresh: true, isFollowUp: Boolean(options.isFollowUp) });
        });
      }
    }

    function populateCompletedTurnEl(turnEl, rec, turnIdx, isCachedRestore = true) {
      const latencyEl = turnEl.querySelector(".js-latency");
      const traceBox = turnEl.querySelector(".trace-box");
      const traceDot = turnEl.querySelector(".js-trace-dot");
      const traceTitle = turnEl.querySelector(".js-trace-title");
      const traceSteps = turnEl.querySelector(".js-trace-steps");
      const chipsEl = turnEl.querySelector(".js-chips");
      const proseEl = turnEl.querySelector(".js-prose");
      const footerEl = turnEl.querySelector(".js-footer");
      const evidenceBox = turnEl.querySelector(".js-evidence-box");
      const evidencePre = turnEl.querySelector(".js-evidence-pre");

      renderChipsInto(chipsEl, rec.matched_nodes || [], turnIdx);
      traceDot.classList.remove("pulse");
      traceDot.classList.add("done");
      traceTitle.textContent = isCachedRestore
        ? `⚡ 已從頁面快取瞬間載入（命中 ${(rec.matched_nodes || []).length} 個核心節點）`
        : `已完成圖譜檢索與合規分析（耗時 ${rec.totalSec || "0.0"}s · 命中 ${(rec.matched_nodes || []).length} 個核心節點）`;
      traceSteps.innerHTML = `
        <div class="trace-step done">快取命中（0ms · 頁面刷新前有效）</div>
        <div class="trace-step done">已同步恢復證據圖譜與原文切片</div>
      `;
      traceBox.removeAttribute("open");
      latencyEl.textContent = isCachedRestore ? "⚡ 快取 0ms" : `${rec.totalSec || "0.0"}s`;
      proseEl.innerHTML = renderMarkdownClean(rec.answer || "", false);
      footerEl.style.display = "flex";
      bindTurnFooterActions(turnEl, rec.query, rec.answer || "", { isFollowUp: turnIdx > 0 });
      evidencePre.textContent = rec.evidence || "無證據內容";
      evidenceBox.style.display = "block";
    }

    // 完整恢復整個多輪歷史會話（嚴格按輪次固定色序 0, 1, 2... 還原圖譜高亮與右側刻度條）
    function restoreSessionFromHistory(sess) {
      if (!sess || !sess.turns || !sess.turns.length) return;
      const body = document.getElementById("answer-drawer-body");
      body.innerHTML = "";
      activeSessionId = sess.id;
      conversationMessages = [];
      currentTurnColorIdx = 0;

      let latestMatched = [];
      sess.turns.forEach((rec, idx) => {
        const rawIds = rec.rawNodes || rec.matched_nodes || [];
        highlightMatchedNodes(rawIds, {
          preservePrev: idx > 0 && Boolean(rec.isAdditiveFollowUp),
          turnIndex: idx
        });
        const turnEl = createChatTurn(rec.query, idx);
        populateCompletedTurnEl(turnEl, rec, idx, true);
        conversationMessages.push({ role: "user", content: rec.query });
        conversationMessages.push({ role: "assistant", content: rec.answer || "" });
        latestMatched = rec.matched_nodes || rawIds;
        lastAnswerMarkdown = rec.answer || "";
      });

      currentTurnColorIdx = sess.turns.length;
      lastTurnMatchedNodes = latestMatched;
      activeThreadAnchor = sess.anchor || sess.latestQuery || "";
      autoShowPrimaryNodeOnLeft(latestMatched);
      updateTurnRuler();
      body.scrollTop = body.scrollHeight;
      syncActiveRulerTick(sess.turns.length - 1);
      updateHistoryUI();
    }

    function restoreFromHistoryRecord(rec) {
      // 單輪快取命中時，建立一筆對應的新對話會話並還原
      const timeStr = new Date().toLocaleTimeString("zh-HK", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const turnRec = { ...rec, timeStr };
      activeSessionId = null;
      upsertSessionTurn(turnRec, false);
      const sess = queryHistory.find(s => s.id === activeSessionId);
      if (sess) restoreSessionFromHistory(sess);
    }

    function extractAnchorFromQuery(q) {
      const hits = [];
      const u = String(q || "").toUpperCase();
      if (/HDIL-2026-MC-01|樣本\s*A|样本\s*A|合同\s*A|主合同|CONTRACT\s*A|HARBOURFRONT|\bAB\b|A\s*(?:與|和|對比|对比|VS)\s*B/.test(u)) hits.push("HDIL-2026-MC-01");
      if (/APEX-2026-SUB-MEP-01|樣本\s*B|样本\s*B|合同\s*B|分包|CONTRACT\s*B|VANGUARD|\bAB\b|A\s*(?:與|和|對比|对比|VS)\s*B/.test(u)) hits.push("APEX-2026-SUB-MEP-01");
      const caps = [...u.matchAll(/(?:CAP\.?\s*|第\s*)(\d{2,3}[A-Z]?)(?:\s*章)?/g)].map(m => `Cap. ${m[1]}`);
      hits.push(...caps);
      return [...new Set(hits)].join(" ");
    }

    function autoShowPrimaryNodeOnLeft(matchedIds) {
      if (!matchedIds || !matchedIds.length) return;
      const ansDrawer = document.getElementById("answer-drawer");
      if (window.innerWidth <= 960) return;
      if (ansDrawer && ansDrawer.classList.contains("expanded")) return;
      const primaryNode = nodeMap.get(matchedIds[0]);
      if (primaryNode) {
        openNodeDrawer(primaryNode);
      }
    }

    async function runQuery(presetQuery = null, options = {}) {
      if (!apiKey) {
        openApiKeyModal();
        return;
      }
      if (isQueryRunning) return;

      const isFollowUp = Boolean(options.isFollowUp);
      const forceRefresh = Boolean(options.forceRefresh);
      const topInput = document.getElementById("search-input");
      const followInput = document.getElementById("followup-input");

      let query = "";
      if (typeof presetQuery === "string" && presetQuery.trim()) {
        query = presetQuery.trim();
        if (!isFollowUp && topInput) {
          topInput.value = query;
          const clearBtn = document.getElementById("clear-search-btn");
          if (clearBtn) clearBtn.classList.add("visible");
        }
      } else if (isFollowUp && followInput) {
        query = followInput.value.trim();
      } else if (topInput) {
        query = topInput.value.trim();
      }
      if (!query) return;

      if (isFollowUp && followInput) {
        followInput.value = "";
        followInput.style.height = "auto";
      }

      const effectiveLang = detectEffectiveLang(query, responseLang);
      const cacheKey = normalizeCacheKey(query, effectiveLang);

      // 若非追問且未強制重新生成，優先檢查是否已有相同起始問題的歷史會話或單輪快取（0ms 瞬間回傳）
      if (!forceRefresh && !isFollowUp) {
        const matchedSess = queryHistory.find(
          s => s.turns.length === 1 && normalizeCacheKey(s.firstQuery, s.effectiveLang) === cacheKey
        );
        if (matchedSess) {
          restoreSessionFromHistory(matchedSess);
          return;
        }
        if (queryCache.has(cacheKey)) {
          restoreFromHistoryRecord(queryCache.get(cacheKey));
          return;
        }
      }

      // 追問錨點繼承與防越界校驗
      ensureCorpusIDF();
      const rawTokens = tokenizeTextZeroEnum(query);
      const rawTotalIDF = rawTokens.reduce((s, tk) => s + getTokenIDF(tk), 0) || 1;
      const rawKnownIDF = rawTokens.reduce((s, tk) => s + (corpusIDF && corpusIDF.has(tk) ? getTokenIDF(tk) : 0), 0);
      const rawIdfRatio = rawKnownIDF / rawTotalIDF;
      const hasFollowUpCue = /(?:第\s*\d+(?:\.\d+)?\s*[条條款]|CLAUSE\s+\d|SECTION\s+\d|條款|条款|合同|合約|合约|法例|條例|条例|衝突|冲突|對比|对比|比較|比较|修改|修正|建議|建议|風險|风险|違約|违约|罰款|罚款|付款|扣款|停工|工傷|工伤|工資|工资|夜勤|噪音|仲裁|它|這|这|該|该|上述|前面|上文|補充|补充|總結|总结|總體|总体|怎麼改|怎么改|\bAB\b|\bVS\b|\bCOMPARE\b|\bCLAUSE\b|\bCONTRACT\b|\bIT\b|\bTHIS\b|\bTHESE\b|\bABOVE\b)/i.test(query);

      const ownAnchor = extractAnchorFromQuery(query);
      const isAdditiveFollowUp = isFollowUp && /對比|对比|比較|比较|衝突|冲突|補充|补充|加上|結合|结合|同時|同时|以及|還有|還有|\bVS\b|\bCOMPARE\b|\bBOTH\b|\bALSO\b|\bAB\b/i.test(query);
      const shouldInheritAnchor = isFollowUp && activeThreadAnchor && (Boolean(ownAnchor) || hasFollowUpCue || rawIdfRatio >= 0.45);

      if (shouldInheritAnchor && ownAnchor && isAdditiveFollowUp) {
        activeThreadAnchor = [...new Set([...activeThreadAnchor.split(/\s+/), ...ownAnchor.split(/\s+/)])].filter(Boolean).join(" ");
      } else if (ownAnchor) {
        activeThreadAnchor = ownAnchor;
      }
      const retrievalQuery = shouldInheritAnchor
        ? `${activeThreadAnchor} ${query}`
        : query;

      currentAbortController = new AbortController();
      updateBusyUI(true);

      const turnIndex = isFollowUp ? currentTurnColorIdx : 0;
      if (!isFollowUp) {
        const bodyEl = document.getElementById("answer-drawer-body");
        if (bodyEl) bodyEl.innerHTML = "";
        conversationMessages = [];
        lastTurnMatchedNodes = [];
        currentTurnColorIdx = 0;
        activeSessionId = null;
      }
      currentTurnColorIdx = turnIndex + 1;

      const startTs = performance.now();
      const turnEl = createChatTurn(query, turnIndex);
      const body = document.getElementById("answer-drawer-body");
      const latencyEl = turnEl.querySelector(".js-latency");
      const traceBox = turnEl.querySelector(".trace-box");
      const traceDot = turnEl.querySelector(".js-trace-dot");
      const traceTitle = turnEl.querySelector(".js-trace-title");
      const traceSteps = turnEl.querySelector(".js-trace-steps");
      const chipsEl = turnEl.querySelector(".js-chips");
      const proseEl = turnEl.querySelector(".js-prose");
      const footerEl = turnEl.querySelector(".js-footer");
      const evidenceBox = turnEl.querySelector(".js-evidence-box");
      const evidencePre = turnEl.querySelector(".js-evidence-pre");

      let lastRenderTs = 0;
      let latestPartial = "";
      let retrievedInfo = { retrievalMs: 0, chunkCount: 0, rawNodes: [] };

      try {
        let data = null;
        const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);

        if (isLocal && !isFollowUp) {
          try {
            const resp = await fetch(`${API_BASE}/api/query`, {
              method: "POST",
              signal: currentAbortController.signal,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query, api_key: apiKey, lang: responseLang })
            });
            if (resp.ok) data = await resp.json();
          } catch (e) {
            if (e && e.name === "AbortError") throw e;
          }
        }

        if (!data) {
          data = await runStaticBrowserRAG(query, apiKey, {
            retrievalQuery,
            historyMessages: shouldInheritAnchor ? conversationMessages : [],
            signal: currentAbortController.signal,
            onRetrieved: info => {
              retrievedInfo = info;
              const rawNodes = info.matchedNodes || [];
              const mergedNodes = isAdditiveFollowUp && lastTurnMatchedNodes.length
                ? [...new Set([...rawNodes, ...lastTurnMatchedNodes])].slice(0, 12)
                : rawNodes;
              info.rawNodes = rawNodes;
              info.mergedNodes = mergedNodes;
              autoShowPrimaryNodeOnLeft(rawNodes.length ? rawNodes : mergedNodes);
              highlightMatchedNodes(rawNodes, { preservePrev: isAdditiveFollowUp, turnIndex });
              renderChipsInto(chipsEl, mergedNodes, turnIndex);
              latencyEl.textContent = `檢索 ${info.retrievalMs}ms`;
              traceTitle.textContent = `圖譜定位完成（${info.retrievalMs}ms），流式生成分析中…`;
              traceSteps.innerHTML = `
                <div class="trace-step done">知識圖譜拓撲檢索完成（${info.retrievalMs}ms · 鎖定 ${rawNodes.length} 個核心節點）</div>
                <div class="trace-step done">跨文檔證據鏈提取完成（召回 ${info.chunkCount} 塊合同與法例原文切片）</div>
                <div class="trace-step running">正在流式撰寫結構化分析報告…</div>
              `;
              evidencePre.textContent = info.evidence || "無證據內容";
              evidenceBox.style.display = "block";
            },
            onToken: partial => {
              latestPartial = partial;
              const now = performance.now();
              if (now - lastRenderTs > 45) {
                lastRenderTs = now;
                proseEl.innerHTML = renderMarkdownClean(partial, true);
                smartScrollDrawerToBottom(body);
              }
            }
          });
        } else {
          highlightMatchedNodes(data.matched_nodes || [], { preservePrev: false, turnIndex });
          renderChipsInto(chipsEl, data.matched_nodes || [], turnIndex);
        }

        const totalSec = ((performance.now() - startTs) / 1000).toFixed(1);
        const rawNodes = (retrievedInfo && retrievedInfo.rawNodes && retrievedInfo.rawNodes.length)
          ? retrievedInfo.rawNodes
          : (data.matched_nodes || []);
        const matched = (retrievedInfo && retrievedInfo.mergedNodes) || data.matched_nodes || [];
        lastTurnMatchedNodes = matched;
        lastAnswerMarkdown = data.answer || "";

        traceDot.classList.remove("pulse");
        traceDot.classList.add("done");
        traceTitle.textContent = matched.length > 0
          ? `已完成圖譜檢索與合規分析（耗時 ${totalSec}s · 命中 ${matched.length} 個核心節點）`
          : `檢索完成（耗時 ${totalSec}s · 觸發資料庫邊界防護）`;
        traceSteps.innerHTML = matched.length > 0
          ? `
            <div class="trace-step done">知識圖譜拓撲檢索與雙層證據網定位完成</div>
            <div class="trace-step done">原文切片與香港法例對照核驗完成</div>
            <div class="trace-step done">結構化分析結論生成完畢（總計 ${totalSec}s）</div>
          `
          : `<div class="trace-step done">語料覆蓋率未達檢索門檻，已攔截資料外提問（零幻覺防護）</div>`;
        traceBox.removeAttribute("open");
        latencyEl.textContent = `${totalSec}s`;

        renderChipsInto(chipsEl, matched, turnIndex);
        proseEl.innerHTML = renderMarkdownClean(lastAnswerMarkdown, false);

        footerEl.style.display = "flex";
        bindTurnFooterActions(turnEl, query, lastAnswerMarkdown, { isFollowUp });

        evidencePre.textContent = data.evidence || "無證據內容";
        evidenceBox.style.display = "block";
        smartScrollDrawerToBottom(body);

        conversationMessages.push({ role: "user", content: query });
        conversationMessages.push({ role: "assistant", content: lastAnswerMarkdown });
        if (conversationMessages.length > 10) {
          conversationMessages = conversationMessages.slice(-10);
        }

        upsertSessionTurn({
          query,
          effectiveLang,
          answer: lastAnswerMarkdown,
          evidence: data.evidence || "",
          matched_nodes: matched,
          rawNodes,
          isAdditiveFollowUp,
          chunkCount: retrievedInfo.chunkCount || 0,
          retrievalMs: retrievedInfo.retrievalMs || 0,
          totalSec,
          anchor: activeThreadAnchor || ownAnchor || query,
          timeStr: new Date().toLocaleTimeString("zh-HK", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" })
        }, isFollowUp);
      } catch (err) {
        traceDot.classList.remove("pulse");
        if (err && err.name === "AbortError") {
          traceDot.classList.add("done");
          traceTitle.textContent = "已手動停止生成";
          traceSteps.innerHTML = `<div class="trace-step done">生成已中止，保留目前輸出內容</div>`;
          traceBox.removeAttribute("open");
          latencyEl.textContent = "已停止";
          if (latestPartial) {
            lastAnswerMarkdown = latestPartial;
            proseEl.innerHTML = renderMarkdownClean(latestPartial, false);
            footerEl.style.display = "flex";
            bindTurnFooterActions(turnEl, query, latestPartial, { isFollowUp });
          }
        } else {
          traceTitle.textContent = "檢索異常";
          traceSteps.innerHTML = `<div class="trace-step">${escapeHtml(err.message || "未知錯誤")}</div>`;
          proseEl.innerHTML = `<div class="surface-block" style="color:#fca5a5;border-color:rgba(248,113,113,0.25);background:rgba(248,113,113,0.08);">${escapeHtml(err.message || "未知錯誤")}</div>`;
        }
      } finally {
        currentAbortController = null;
        updateBusyUI(false);
        syncActiveRulerTick(turnIndex);
      }
    }

    /* ============ 資料載入 ============ */

    async function loadGraphAndChunks() {
      const statsEl = document.getElementById("graph-stats");
      const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);

      const chunkUrls = isLocal
        ? [`${API_BASE}/api/chunks`, "./pdf_work_dir_local/kv_store_text_chunks.json", "./kv_store_text_chunks.json"]
        : ["./pdf_work_dir_local/kv_store_text_chunks.json", "./kv_store_text_chunks.json"];
      for (const url of chunkUrls) {
        try {
          const r = await fetch(url);
          if (r.ok) { textChunksMap = await r.json(); break; }
        } catch (_) {}
      }

      for (const url of ["./pdf_work_dir_local/kv_store_community_reports.json", "./kv_store_community_reports.json"]) {
        try {
          const r = await fetch(url);
          if (r.ok) { communityReportsMap = await r.json(); break; }
        } catch (_) {}
      }

      const graphUrls = isLocal
        ? [`${API_BASE}/api/graphml`, "./pdf_work_dir_local/graph_chunk_entity_relation.graphml", "./graph_chunk_entity_relation.graphml"]
        : ["./pdf_work_dir_local/graph_chunk_entity_relation.graphml", "./graph_chunk_entity_relation.graphml"];
      for (const url of graphUrls) {
        try {
          const r = await fetch(url);
          if (r.ok) {
            const xml = await r.text();
            if (xml.includes("<graphml")) {
              pendingGraphData = parseGraphML(xml);
              statsEl.textContent =
                `${pendingGraphData.nodes.length} 節點 · ${pendingGraphData.links.length} 連邊`;
              statsEl.classList.remove("loading");

              maybeStartSimulation();
              return;
            }
          }
        } catch (_) {}
      }

      statsEl.textContent = "未偵測到圖譜檔案";
      statsEl.classList.remove("loading");
      statsEl.style.color = "#f87171";
    }

    function openApiKeyModal() {
      const modal = document.getElementById("apikey-modal");
      const input = document.getElementById("apikey-input");
      input.value = apiKey;
      modal.classList.remove("hidden");
      setTimeout(() => input.focus(), 60);
    }

    function saveApiKey() {
      const rawVal = document.getElementById("apikey-input").value;
      const val = sanitizeApiKey(rawVal);
      if (!val) {
        alert("請輸入有效的密匙");
        return;
      }
      apiKey = val;
      sessionStorage.setItem(STORAGE_KEY, apiKey);
      document.getElementById("apikey-modal").classList.add("hidden");
      maybeStartSimulation();
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (window.marked) {
        marked.setOptions({ breaks: true, gfm: true });
      }

      initGraph();
      loadGraphAndChunks();

      if (!apiKey) {
        openApiKeyModal();
      }

      document.getElementById("save-apikey-btn").addEventListener("click", saveApiKey);
      document.getElementById("apikey-input").addEventListener("keydown", e => {
        if (e.key === "Enter") saveApiKey();
      });
      document.getElementById("key-btn").addEventListener("click", openApiKeyModal);
      document.querySelectorAll("#lang-switch .lang-opt").forEach(btn => {
        btn.classList.toggle("active", (btn.dataset.lang || "auto") === responseLang);
        btn.addEventListener("click", () => {
          responseLang = btn.dataset.lang || "auto";
          sessionStorage.setItem(LANG_STORAGE_KEY, responseLang);
          document.querySelectorAll("#lang-switch .lang-opt").forEach(b => b.classList.toggle("active", b === btn));
        });
      });

      const searchInput = document.getElementById("search-input");
      const clearSearchBtn = document.getElementById("clear-search-btn");
      searchInput.addEventListener("input", () => {
        clearSearchBtn.classList.toggle("visible", searchInput.value.length > 0);
      });
      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        clearSearchBtn.classList.remove("visible");
        searchInput.focus();
      });

      document.getElementById("search-btn").addEventListener("click", () => runQuery());
      searchInput.addEventListener("keydown", e => {
        if (e.key === "Enter") runQuery();
      });

      document.querySelectorAll("#quick-prompts .quick-pill").forEach(pill => {
        pill.addEventListener("click", () => runQuery(pill.dataset.query || ""));
      });

      // 頂部收縮膠囊「新檢索」點擊展開
      const expandSearchBtn = document.getElementById("expand-search-btn");
      if (expandSearchBtn) {
        expandSearchBtn.addEventListener("click", () => {
          setCommandBarCollapsed(false);
          setTimeout(() => {
            searchInput.focus();
            searchInput.select();
          }, 80);
        });
      }

      // 歷史紀錄面板開關與清空
      const historyBtn = document.getElementById("history-btn");
      const historyPopover = document.getElementById("history-popover");
      if (historyBtn && historyPopover) {
        historyBtn.addEventListener("click", e => {
          e.stopPropagation();
          updateHistoryUI();
          historyPopover.classList.toggle("open");
        });
        document.getElementById("close-history-btn").addEventListener("click", () => {
          historyPopover.classList.remove("open");
        });
        document.getElementById("clear-history-btn").addEventListener("click", () => {
          queryCache.clear();
          queryHistory.length = 0;
          activeSessionId = null;
          updateHistoryUI();
        });
        document.addEventListener("click", e => {
          if (historyPopover.classList.contains("open") && !historyPopover.contains(e.target) && !historyBtn.contains(e.target)) {
            historyPopover.classList.remove("open");
          }
        });
      }

      // 底部追問框：自動增高、Enter 送出、Shift+Enter 換行、生成中點擊停止
      const followInput = document.getElementById("followup-input");
      const followSendBtn = document.getElementById("followup-send-btn");
      if (followInput && followSendBtn) {
        followInput.addEventListener("input", () => {
          followInput.style.height = "auto";
          followInput.style.height = Math.min(110, followInput.scrollHeight) + "px";
        });
        followInput.addEventListener("keydown", e => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!isQueryRunning) runQuery(null, { isFollowUp: true });
          }
        });
        followSendBtn.addEventListener("click", () => {
          if (isQueryRunning && currentAbortController) {
            currentAbortController.abort();
          } else {
            runQuery(null, { isFollowUp: true });
          }
        });
      }

      const expandBtn = document.getElementById("expand-answer-btn");
      expandBtn.addEventListener("click", () => {
        const drawer = document.getElementById("answer-drawer");
        const isExpanded = drawer.classList.toggle("expanded");
        expandBtn.textContent = isExpanded ? "收合寬度" : "展開閱讀";
        if (isExpanded) {
          document.getElementById("node-drawer").classList.remove("open");
        } else if (lastTurnMatchedNodes.length) {
          autoShowPrimaryNodeOnLeft(lastTurnMatchedNodes);
        }
        setTimeout(() => focusHighlightedSubgraph(450), 300);
      });

      const answerBodyEl = document.getElementById("answer-drawer-body");
      if (answerBodyEl) {
        answerBodyEl.addEventListener("scroll", () => syncActiveRulerTick(), { passive: true });
      }

      document.getElementById("clear-thread-btn").addEventListener("click", () => {
        if (isQueryRunning && currentAbortController) currentAbortController.abort();
        document.getElementById("answer-drawer-body").innerHTML = "";
        lastAnswerMarkdown = "";
        conversationMessages = [];
        activeThreadAnchor = "";
        activeSessionId = null;
        updateTurnRuler();
        updateHistoryUI();
        highlightedNodes.clear();
        highlightedLinks.clear();
        highlightedNodeColors.clear();
        highlightedLinkColors.clear();
        secondaryNodes.clear();
        secondaryLinks.clear();
        currentTurnColorIdx = 0;
        document.getElementById("answer-drawer").classList.remove("open", "expanded");
        expandBtn.textContent = "展開閱讀";
        setCommandBarCollapsed(false);
        setQuickPromptsVisible(true);
      });

      const legendGrid = document.getElementById("legend-grid");
      legendGrid.querySelectorAll("span[data-type]").forEach(item => {
        item.addEventListener("click", () => {
          const clickedType = item.dataset.type;
          activeTypeFilter = activeTypeFilter === clickedType ? null : clickedType;
          legendGrid.classList.toggle("filtering", Boolean(activeTypeFilter));
          legendGrid.querySelectorAll("span[data-type]").forEach(el => {
            el.classList.toggle("active-filter", el.dataset.type === activeTypeFilter);
          });
        });
      });

      const copyBtn = document.getElementById("copy-answer-btn");
      copyBtn.addEventListener("click", async () => {
        if (!lastAnswerMarkdown) return;
        try {
          await navigator.clipboard.writeText(lastAnswerMarkdown);
          copyBtn.textContent = "已複製";
          setTimeout(() => { copyBtn.textContent = "複製結論"; }, 1600);
        } catch (_) {}
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          selectedNode = null;
          document.getElementById("node-drawer").classList.remove("open");
          document.getElementById("answer-drawer").classList.remove("open");
          const hp = document.getElementById("history-popover");
          if (hp) hp.classList.remove("open");
          setCommandBarCollapsed(false);
          setQuickPromptsVisible(true);
        }
      });

      document.getElementById("close-node-btn").addEventListener("click", () => {
        selectedNode = null;
        document.getElementById("node-drawer").classList.remove("open");
        if (highlightedNodes.size > 0) setTimeout(() => focusHighlightedSubgraph(420), 220);
      });

      document.getElementById("close-answer-btn").addEventListener("click", () => {
        document.getElementById("answer-drawer").classList.remove("open");
        setCommandBarCollapsed(false);
        setQuickPromptsVisible(true);
      });

      document.getElementById("zoom-in-btn").addEventListener("click", () => {
        graphInstance.zoom(Math.min(8, graphInstance.zoom() * 1.45), 250);
      });
      document.getElementById("zoom-out-btn").addEventListener("click", () => {
        graphInstance.zoom(Math.max(0.15, graphInstance.zoom() / 1.45), 250);
      });
      document.getElementById("zoom-fit-btn").addEventListener("click", () => {
        highlightedNodes.clear();
        highlightedLinks.clear();
        highlightedNodeColors.clear();
        highlightedLinkColors.clear();
        secondaryNodes.clear();
        secondaryLinks.clear();
        currentTurnColorIdx = 0;
        activeTypeFilter = null;
        legendGrid.classList.remove("filtering");
        legendGrid.querySelectorAll("span[data-type]").forEach(el => el.classList.remove("active-filter"));
        selectedNode = null;
        document.getElementById("node-drawer").classList.remove("open");
        graphInstance.zoomToFit(500, 70);
      });
    });
  </script>
</body>
</html>
